# Staging Phoenix Test Pipeline
#
# Provisions a fresh VPS from scratch, verifies the full stack,
# runs smoke checks, and verifies teardown of this run's resources.
#
# Cost: ~€0.01/run (Hetzner hourly billing)
# Duration: ~35-45 minutes
#
# One-time setup required before first run — see docs in CLAUDE.md.
#
# Secret config values use stdin; the resource identity is GitHub's run/attempt ID.
# No untrusted event payload or branch name is interpolated into shell commands.

name: Staging Phoenix Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-phoenix
  cancel-in-progress: false

env:
  STAGING_PRIVATE_REPOSITORY: ${{ vars.STAGING_PRIVATE_REPOSITORY }}
  STAGING_MODEL: anthropic/claude-sonnet-4-6
  PHOENIX_RESOURCE_NAME: openclaw-staging-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  phoenix:
    runs-on: ubuntu-latest
    # Step deadlines leave teardown time before the job deadline (fixture checked).
    # Cancellation or runner loss can still interrupt cleanup; this is not a teardown guarantee.
    timeout-minutes: 140

    steps:
      # ── Setup ────────────────────────────────────────────────────
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        timeout-minutes: 2
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Pulumi dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Install Ansible
        timeout-minutes: 3
        run: pip install ansible

      - name: Install hcloud CLI
        timeout-minutes: 3
        run: |
          set -euo pipefail
          VERSION=$(curl --fail --silent --show-error https://api.github.com/repos/hetznercloud/cli/releases/latest |
            jq -ers 'if length == 1 and (.[0].tag_name | type == "string" and length > 0)
              then .[0].tag_name else error("Invalid hcloud release metadata") end')
          curl --fail --silent --show-error --location "https://github.com/hetznercloud/cli/releases/download/${VERSION}/hcloud-linux-amd64.tar.gz" -o hcloud.tar.gz
          tar xzf hcloud.tar.gz
          sudo mv hcloud /usr/local/bin/
          rm hcloud.tar.gz

      - name: Connect to Tailscale
        timeout-minutes: 3
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ── Pre-deploy config ────────────────────────────────────────
      - name: Write Codex auth file
        timeout-minutes: 1
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -n "$CODEX_AUTH_JSON" ]; then
            mkdir -p ~/.codex
            install -m 600 /dev/null ~/.codex/auth.json
            printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          fi

      - name: Generate staging openclaw.yml
        timeout-minutes: 1
        run: |
          printf '%s\n' '---' "openclaw_model_primary: \"$STAGING_MODEL\"" > ansible/group_vars/openclaw.yml
          cat >> ansible/group_vars/openclaw.yml << 'YAML'
          # Staging deployment config (auto-generated by CI — do not edit)
          openclaw_model_fallbacks: []
          openclaw_thinking_default: "off"
          openclaw_custom_models: {}

          # Real-note credentials are usable only through read-only MCP tools.
          # Native Claude tools stay disabled for every session, including heartbeats.
          openclaw_tools_allow:
            - github_get_file_contents
            - github-test_get_file_contents
          openclaw_cli_backends:
            claude-cli:
              args: ["-p", "--output-format", "stream-json", "--include-partial-messages", "--verbose", "--tools", "", "--strict-mcp-config"]
              resumeArgs: ["-p", "--output-format", "stream-json", "--include-partial-messages", "--verbose", "--tools", "", "--strict-mcp-config", "--resume", "{sessionId}"]

          openclaw_heartbeat_interval: "30m"
          openclaw_heartbeat_active_hours:
            start: "00:00"
            end: "24:00"

          openclaw_agents:
            - id: "main"
              is_default: true
              scheduled_automation_enabled: false
              deliver_to: "{{ telegram_user_id | default('') }}"
              deliver_type: "dm"
              deliver_channel: "telegram"
            - id: "test"
              is_default: false
              scheduled_automation_enabled: true
              deliver_to: "{{ telegram_test_user_id | default('') }}"
              deliver_type: "dm"
              deliver_channel: "telegram"

          openclaw_cron_jobs:
            - name: "main: Staging Test Cron"
              agent: "main"
              schedule: "0 0 30 2 *"
              message: "Staging test cron — this should never fire."
            - name: "test: Staging Test Cron"
              agent: "test"
              schedule: "0 0 30 2 *"
              message: "Staging test cron — this should never fire."

          # All MCP server types except node-exec
          openclaw_mcp_server_types:
            - type: "github"
              name_prefix: "github"
            - type: "codex"
              name_prefix: "codex"
            - type: "claude-code"
              name_prefix: "claude"
            - type: "pi"
              name_prefix: "pi"
            - type: "qmd"
              name_prefix: "qmd"

          # Never attach public staging Git backups to the owner's live cloud vault.
          obsidian_headless_enabled: false

          node_exec_enabled: false
          YAML

      # ── Pulumi stack ─────────────────────────────────────────────
      - name: Initialize Pulumi staging stack
        timeout-minutes: 5
        id: init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_TOKEN: ${{ secrets.STAGING_GITHUB_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN_PAT: ${{ secrets.STAGING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PHOENIX_RESOURCE_NAME" =~ ^openclaw-staging-[0-9]+-[0-9]+$ ]]
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PULUMI_BACKEND_URL \
            PULUMI_CONFIG_PASSPHRASE HCLOUD_TOKEN GH_TOKEN TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET \
            CLAUDE_SETUP_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_USER_ID XAI_API_KEY GITHUB_TOKEN_PAT \
            STAGING_PRIVATE_REPOSITORY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required Phoenix input $key is missing or empty"
              exit 1
            fi
          done
          [[ "$STAGING_PRIVATE_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || {
            echo '::error::STAGING_PRIVATE_REPOSITORY must name an owner/repository'
            exit 1
          }
          # A public repository cannot prove authenticated private MCP access.
          gh api "repos/$STAGING_PRIVATE_REPOSITORY" |
            jq -es --arg repo "$STAGING_PRIVATE_REPOSITORY" \
              'length == 1 and .[0].private == true and .[0].full_name == $repo' >/dev/null
          gh api "repos/$STAGING_PRIVATE_REPOSITORY/contents/" |
            jq -es 'length == 1 and (.[0] | type == "array" and length > 0 and
              all(.[]; .type == "file" or .type == "dir" or .type == "symlink" or .type == "submodule"))' >/dev/null
          ANONYMOUS_STATUS=$(curl -q --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' "https://api.github.com/repos/$STAGING_PRIVATE_REPOSITORY")
          test "$ANONYMOUS_STATUS" = 404 || {
            echo '::error::Private repository did not reject anonymous access'
            exit 1
          }
          # The server joins the tailnet with a key minted for this run only:
          # single use, ephemeral (the device removes itself when offline),
          # pre-authorized, tag:openclaw-staging, valid for one hour. A stored auth key
          # expires after at most 90 days; this cannot. Credentials travel on
          # stdin or in a private file, never in argv.
          [[ "$TS_OAUTH_CLIENT_ID$TS_OAUTH_SECRET" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo '::error::Tailscale OAuth credentials contain characters that need URL encoding'
            exit 1
          }
          OAUTH_TOKEN=$(printf 'client_id=%s&client_secret=%s&grant_type=client_credentials' \
              "$TS_OAUTH_CLIENT_ID" "$TS_OAUTH_SECRET" |
            curl -q --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --data @- https://api.tailscale.com/api/v2/oauth/token |
            jq -er '.access_token | select(type == "string" and length > 0)') || {
            echo '::error::Could not obtain a Tailscale OAuth token'
            exit 1
          }
          AUTH_HEADER=$(umask 077 && mktemp "$RUNNER_TEMP/ts-auth-header.XXXXXX")
          printf 'Authorization: Bearer %s\n' "$OAUTH_TOKEN" > "$AUTH_HEADER"
          MINT_RESPONSE=$(umask 077 && mktemp "$RUNNER_TEMP/ts-mint-response.XXXXXX")
          jq -cn --arg description "$PHOENIX_RESOURCE_NAME" '{
              description: $description, expirySeconds: 3600,
              capabilities: {devices: {create: {
                reusable: false, ephemeral: true, preauthorized: true, tags: ["tag:openclaw-staging"]}}}}' |
            curl -q --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "@$AUTH_HEADER" --header 'Content-Type: application/json' \
              --data @- --output "$MINT_RESPONSE" https://api.tailscale.com/api/v2/tailnet/-/keys || {
            rm -f "$AUTH_HEADER" "$MINT_RESPONSE"
            echo '::error::Could not reach the Tailscale API to mint a run-scoped auth key'
            exit 1
          }
          rm -f "$AUTH_HEADER"
          # Surface only the API's own error message (it never contains a key).
          RUN_AUTHKEY=$(jq -er '.key | select(type == "string" and length > 0)' "$MINT_RESPONSE" 2>/dev/null) || {
            echo "::error::Tailscale refused to mint a run-scoped auth key: $(jq -r '.message // "unexpected response"' "$MINT_RESPONSE" 2>/dev/null || echo 'unexpected response'). The tailnet policy must make tag:ci the owner of tag:openclaw-staging."
            rm -f "$MINT_RESPONSE"
            exit 1
          }
          rm -f "$MINT_RESPONSE"
          # No add-mask: the key goes to Pulumi as requireSecret config, which
          # taints the derived user-data, and stack exports are only piped to jq.
          # Step output must stay credential-free (the safety tests enforce it).
          cd pulumi
          # An existing stack belongs to an earlier run: never adopt or erase it.
          pulumi stack init staging --non-interactive
          echo 'owned=true' >> "$GITHUB_OUTPUT"

          # Server config
          pulumi config set serverName "$PHOENIX_RESOURCE_NAME" --stack staging
          pulumi config set serverType cx43 --stack staging
          pulumi config set tailscaleTags "tag:openclaw-staging" --stack staging

          # Agent IDs (main is always present; "test" is the additional agent)
          pulumi config set agentIds "test" --stack staging

          # Required secrets
          printf '%s' "$HCLOUD_TOKEN" | pulumi config set hcloud:token --secret --stack staging --non-interactive
          printf '%s' "$RUN_AUTHKEY" | pulumi config set tailscaleAuthKey --secret --stack staging --non-interactive
          printf '%s' "$CLAUDE_SETUP_TOKEN" | pulumi config set claudeSetupToken --secret --stack staging --non-interactive

          # Telegram
          printf '%s' "$TELEGRAM_BOT_TOKEN" | pulumi config set telegramBotToken --secret --stack staging --non-interactive
          pulumi config set telegramUserId "$TELEGRAM_USER_ID" --stack staging
          pulumi config set telegramTestUserId "$TELEGRAM_USER_ID" --stack staging

          # Web search
          printf '%s' "$XAI_API_KEY" | pulumi config set xaiApiKey --secret --stack staging --non-interactive

          # GitHub MCP (same PAT for all agents)
          printf '%s' "$GITHUB_TOKEN_PAT" | pulumi config set githubToken --secret --stack staging --non-interactive
          printf '%s' "$GITHUB_TOKEN_PAT" | pulumi config set githubTokenTest --secret --stack staging --non-interactive

          # Workspaces
          pulumi config set workspaceRepoUrl "git@github.com:pandysp/openclaw-staging-workspace.git" --stack staging
          pulumi config set workspaceTestRepoUrl "git@github.com:pandysp/openclaw-staging-workspace-test.git" --stack staging

      # Existing deploy-key resources must be usable before Ansible restores Git.
      # Target no dependents: the server and provisioner belong to the full update.
      - name: Create workspace deploy keys
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd pulumi
          KEY_URN='urn:pulumi:staging::openclaw-infra::tls:index/privateKey:PrivateKey::workspace-deploy-key'
          pulumi up --yes --stack staging --non-interactive \
            --target "$KEY_URN" --target "${KEY_URN}-test"
          if ! pulumi stack export --stack staging | jq -es \
            --arg main "$KEY_URN" --arg test "${KEY_URN}-test" '
              length == 1 and (.[0].deployment.resources |
                type == "array" and
                ([.[] | select(.type != "pulumi:pulumi:Stack" and
                  (.type | startswith("pulumi:providers:") | not))] |
                  length == 2 and (map(.urn) | sort) == ([$main, $test] | sort) and
                  all(.[]; .type == "tls:index/privateKey:PrivateKey" and
                    (.id | type == "string" and length > 0))))' >/dev/null 2>&1; then
            echo '::error::Could not verify that only the two existing deploy-key resources were created'
            exit 1
          fi

      - name: Add deploy keys to GitHub repos
        timeout-minutes: 2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.STAGING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pulumi

          MAIN_KEY=$(pulumi stack output workspaceDeployPublicKey --stack staging)
          printf '%s\n' "$MAIN_KEY" | gh repo deploy-key add - \
            -R pandysp/openclaw-staging-workspace \
            -t "$PHOENIX_RESOURCE_NAME" -w

          TEST_KEY=$(pulumi stack output agentWorkspaceKeys --json --show-secrets --stack staging \
            | jq -er '."test".publicKey | select(type == "string" and length > 0)')
          printf '%s\n' "$TEST_KEY" | gh repo deploy-key add - \
            -R pandysp/openclaw-staging-workspace-test \
            -t "$PHOENIX_RESOURCE_NAME" -w

      # ── Deploy ───────────────────────────────────────────────────
      - name: Deploy staging infrastructure
        timeout-minutes: 40
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd pulumi
          # Hetzner rejects placements when a location is out of the requested
          # server type. Only that error moves on to the next location; the
          # placement fails before the server exists, so nothing partial to
          # keep. Any other failure stops here.
          for location in nbg1 fsn1 hel1; do
            pulumi config set serverLocation "$location" --stack staging
            # A failed update (including a checkpoint write) must never turn green.
            if pulumi up --yes --stack staging --non-interactive 2>&1 | tee "$RUNNER_TEMP/pulumi-up.log"; then
              break
            fi
            if ! grep -q 'resource_unavailable' "$RUNNER_TEMP/pulumi-up.log"; then
              exit 1
            fi
            echo "::warning::Hetzner has no capacity in $location; trying the next location"
            if [[ "$location" == hel1 ]]; then
              echo '::error::Hetzner has no capacity in every configured location'
              exit 1
            fi
          done
          if ! awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /PLAY RECAP/ { recap = 1; hosts = 0; failed = 0; completed = 0; next }
            recap && /=== Provisioning complete ===/ { completed = 1 }
            recap && /(ok|failed|unreachable)=/ {
              hosts++
              if ($0 !~ /(^|[[:space:]])ok=[1-9][0-9]*([[:space:]]|$)/ ||
                  $0 !~ /(^|[[:space:]])unreachable=0([[:space:]]|$)/ ||
                  $0 !~ /(^|[[:space:]])failed=0([[:space:]]|$)/) failed = 1
            }
            END { exit !(recap && hosts > 0 && !failed && completed) }
          ' "$RUNNER_TEMP/pulumi-up.log"; then
            echo '::error::Provisioning did not finish with a complete successful Ansible recap'
            exit 1
          fi

      - name: Resolve staging host
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          set -euo pipefail
          EXPECTED=$(cd pulumi && pulumi stack output tailscaleHostname --stack staging)
          test "$EXPECTED" = "$PHOENIX_RESOURCE_NAME"
          PEER_STATUS=$(tailscale status --json)
          HOST=$(printf '%s' "$PEER_STATUS" | jq -er --arg name "$EXPECTED" '
            .MagicDNSSuffix as $suffix |
            [.Peer[] | select(.HostName == $name)] |
            if length == 1 and .[0].Online == true and
               .[0].DNSName == ($name + "." + $suffix + ".")
            then .[0].DNSName | rtrimstr(".")
            else error("Expected exactly one online peer with this run identity") end')
          # Tailscale checks the host key against its authenticated control plane.
          ACTUAL_NAME=$(tailscale ssh "ubuntu@$HOST" hostname)
          test "$ACTUAL_NAME" = "$EXPECTED"
          IPV4=$(cd pulumi && pulumi stack output serverIpv4 --stack staging)
          tailscale ssh "ubuntu@$HOST" 'ip -j -4 address show scope global' |
            jq -es --arg ip "$IPV4" 'length == 1 and
              (.[0] | type == "array" and any(.[].addr_info[]; .local == $ip))' >/dev/null
          NODE_ID=$(printf '%s' "$PEER_STATUS" | jq -er --arg name "$EXPECTED" '
            [.Peer[] | select(.HostName == $name)] | .[0].ID |
            select(type == "string" and test("^[A-Za-z0-9]+$"))')
          printf 'Verified staging host=%s node_id=%s public_ip=%s\n' "$HOST" "$NODE_ID" "$IPV4"
          printf 'STAGING_HOST=%s\nSTAGING_PUBLIC_IP=%s\nPHOENIX_TAILSCALE_NODE_ID=%s\n' \
            "$HOST" "$IPV4" "$NODE_ID" >> "$GITHUB_ENV"

      - name: Trigger workspace git sync
        timeout-minutes: 3
        run: |
          set -euo pipefail
          SSH=(tailscale ssh "ubuntu@${STAGING_HOST:?Run host resolution first}")
          # Reload freshly-written units before checking and starting both agents.
          "${SSH[@]}" "XDG_RUNTIME_DIR=/run/user/1000 systemctl --user daemon-reload"
          for agent in main test; do
            unit="workspace-git-sync-${agent}.service"
            "${SSH[@]}" "XDG_RUNTIME_DIR=/run/user/1000 systemctl --user cat ${unit} >/dev/null"
            "${SSH[@]}" "XDG_RUNTIME_DIR=/run/user/1000 systemctl --user start ${unit}"
          done

      # ── Verify ───────────────────────────────────────────────────
      - name: Run deployment verification
        timeout-minutes: 6
        run: REQUIRED_CHANNELS=telegram OPENCLAW_HOSTNAME="$PHOENIX_RESOURCE_NAME" ./scripts/verify.sh

      - name: Verify scheduled automation and idempotence
        timeout-minutes: 12
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          set -euo pipefail
          die() {
            echo "::error::$1"
            exit 1
          }
          SSH=(tailscale ssh "ubuntu@${STAGING_HOST:?Run host resolution first}")

          BEFORE=$("${SSH[@]}" "openclaw cron list --all --json" | sed -E '/^\[[A-Za-z][^]]*\]/d') \
            || die "Could not query the staging cron inventory"
          STATUS=$("${SSH[@]}" "openclaw status --json" | sed -E '/^\[[A-Za-z][^]]*\]/d') \
            || die "Could not query staging heartbeat status"
          cron_snapshot() {
            jq -ecsS '
              if length != 1 or (.[0].jobs | type) != "array" then
                error("Expected one cron inventory")
              else .[0].jobs end |
              if all(.[]; (.id | type == "string" and length > 0) and
                            (.name | type == "string" and length > 0) and
                            (.agentId == "main" or .agentId == "test") and
                            (.enabled | type == "boolean")) and
                 (map(.id) | unique | length) == length and
                 ([.[] | select(.agentId == "main" and .enabled)] | length) == 0 and
                 ([.[] | select(.agentId == "test" and .enabled)] | length) == 1 then
                map({agentId,name,id,enabled}) | sort_by(.id)
              else error("Cron identity or staging scheduling policy is invalid") end'
          }
          BEFORE_JOBS=$(cron_snapshot <<< "$BEFORE") \
            || die "Invalid cron inventory before repeated provisioning"
          jq -es '
            length == 1 and (.[0].heartbeat.agents |
              type == "array" and (map(.agentId) | sort) == ["main", "test"] and
              all(.[]; if .agentId == "main" then .everyMs == null
                       else (.everyMs | type == "number" and . > 0) end))
          ' >/dev/null <<< "$STATUS" \
            || die "Staging heartbeat state does not match the scheduling policy"

          # The manual provisioner reads the selected stack. Pin it here rather
          # than inheriting CLI metadata; its staging-host guard checks the result.
          (cd pulumi && pulumi stack select staging --non-interactive)
          ./scripts/provision.sh --tags agents,telegram | tee "$RUNNER_TEMP/scheduled-automation-idempotence.log" \
            || die "Second scoped provisioning run failed"
          if ! awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /PLAY RECAP/ { recap = 1; hosts = 0; failed = 0; completed = 0; next }
            recap && /=== Provisioning complete ===/ { completed = 1 }
            recap && /(ok|changed|failed|unreachable)=/ {
              hosts++
              if ($0 !~ /(^|[[:space:]])ok=[1-9][0-9]*([[:space:]]|$)/ ||
                  $0 !~ /(^|[[:space:]])changed=0([[:space:]]|$)/ ||
                  $0 !~ /(^|[[:space:]])unreachable=0([[:space:]]|$)/ ||
                  $0 !~ /(^|[[:space:]])failed=0([[:space:]]|$)/) failed = 1
            }
            END { exit !(recap && hosts > 0 && !failed && completed) }
          ' "$RUNNER_TEMP/scheduled-automation-idempotence.log"; then
            die "Second scoped provisioning run lacked a complete clean unchanged recap"
          fi

          AFTER=$("${SSH[@]}" "openclaw cron list --all --json" | sed -E '/^\[[A-Za-z][^]]*\]/d') \
            || die "Could not query cron IDs after the idempotence run"
          AFTER_JOBS=$(cron_snapshot <<< "$AFTER") \
            || die "Invalid cron inventory after repeated provisioning"
          [[ "$BEFORE_JOBS" == "$AFTER_JOBS" ]] \
            || die "Cron job identity or policy changed during repeated provisioning"

      - name: Verify workspace isolation on native Linux
        timeout-minutes: 12
        run: ./scripts/test-workspace-isolation.sh

      - name: Run smoke test
        timeout-minutes: 5
        run: |
          : "${STAGING_HOST:?Run host resolution first}"
          : "${STAGING_PRIVATE_REPOSITORY:?Validate a private repository before provisioning}"
          : "${STAGING_MODEL:?Use the intended staging model}"
          ./scripts/smoke-test.sh

      # ── Cleanup (only the stack successfully initialized by this run) ──
      - name: Remove deploy keys
        timeout-minutes: 3
        id: cleanup_keys
        if: always() && steps.init.outputs.owned == 'true'
        env:
          GH_TOKEN: ${{ secrets.STAGING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=0
          for repo in pandysp/openclaw-staging-workspace pandysp/openclaw-staging-workspace-test; do
            if ! IDS=$(gh api --paginate --slurp "repos/${repo}/keys" |
              jq -esr --arg title "$PHOENIX_RESOURCE_NAME" '
                select(length == 1) | .[0] |
                select(type == "array" and length > 0 and all(.[]; type == "array") and
                  all(.[][]; (.id | type) == "number" and (.title | type) == "string")) |
                [.[][] | select(.title == $title) | .id | tostring] | join("\n")'); then
              echo "::error::Could not inventory deploy keys for $repo"
              STATUS=1
              continue
            fi
            for id in $IDS; do
              if [[ ! "$id" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Invalid deploy-key ID in $repo inventory"
                STATUS=1
                continue
              fi
              if ! gh api -X DELETE "repos/${repo}/keys/${id}"; then
                echo "::error::Could not delete this run's deploy key $id from $repo"
                STATUS=1
              fi
            done
            if ! LEFT=$(gh api --paginate --slurp "repos/${repo}/keys" |
              jq -esr --arg title "$PHOENIX_RESOURCE_NAME" '
                select(length == 1) | .[0] |
                select(type == "array" and length > 0 and all(.[]; type == "array") and
                  all(.[][]; (.id | type) == "number" and (.title | type) == "string")) |
                [.[][] | select(.title == $title)] | length'); then
              echo "::error::Could not verify deploy-key cleanup for $repo"
              STATUS=1
            elif [[ "$LEFT" != 0 ]]; then
              echo "::error::$LEFT deploy key(s) from this run remain in $repo"
              STATUS=1
            fi
          done
          exit "$STATUS"

      - name: Destroy staging infrastructure
        timeout-minutes: 12
        id: destroy
        if: always() && steps.init.outputs.owned == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd pulumi
          # Retain the checkpoint until independent cleanup verification succeeds.
          pulumi destroy --yes --stack staging --non-interactive

      - name: Remove owned tailnet device
        timeout-minutes: 3
        id: cleanup_tailnet
        if: always() && steps.init.outputs.owned == 'true'
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: ./scripts/cleanup-staging-tailnet.sh --owned-node

      - name: Verify Hetzner cleanup
        timeout-minutes: 3
        id: cleanup_cloud
        if: always() && steps.init.outputs.owned == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=0
          for kind in server ssh-key firewall; do
            case "$kind" in
              server) NAME="$PHOENIX_RESOURCE_NAME" ;;
              ssh-key) NAME="${PHOENIX_RESOURCE_NAME}-key" ;;
              firewall) NAME="${PHOENIX_RESOURCE_NAME}-firewall" ;;
            esac
            if ! LEFT=$(hcloud "$kind" list -o json |
              jq -esr --arg name "$NAME" '
                select(length == 1) | .[0] |
                select(type == "array" and all(.[]; (.id | type) == "number" and (.name | type) == "string")) |
                [.[] | select(.name == $name) | .id | tostring] | join("\n")'); then
              echo "::error::Could not verify $kind cleanup"
              STATUS=1
            elif [[ -n "$LEFT" ]]; then
              echo "::error::This run still owns $kind resource(s): $LEFT"
              STATUS=1
            fi
          done
          exit "$STATUS"

      - name: Remove verified staging stack
        timeout-minutes: 1
        if: >-
          always() && steps.init.outputs.owned == 'true' &&
          steps.cleanup_keys.outcome == 'success' &&
          steps.destroy.outcome == 'success' &&
          steps.cleanup_tailnet.outcome == 'success' &&
          steps.cleanup_cloud.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd pulumi
          pulumi stack rm staging --yes --non-interactive
