# Inventory only: prefixes and age cannot establish resource ownership.
# Phoenix tears down its own stack. Leftovers require explicit investigation.
name: Staging Resource Inventory

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-phoenix
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install hcloud CLI
        run: |
          set -euo pipefail
          VERSION=$(curl --fail --silent --show-error https://api.github.com/repos/hetznercloud/cli/releases/latest |
            jq -ers 'if length == 1 and (.[0].tag_name | type == "string" and length > 0)
              then .[0].tag_name else error("Invalid hcloud release metadata") end')
          curl --fail --silent --show-error --location "https://github.com/hetznercloud/cli/releases/download/${VERSION}/hcloud-linux-amd64.tar.gz" -o hcloud.tar.gz
          tar xzf hcloud.tar.gz
          sudo mv hcloud /usr/local/bin/
          rm hcloud.tar.gz

      - name: Inventory staging cloud resources and deploy keys
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_TOKEN: ${{ secrets.STAGING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOTAL=0
          for kind in server ssh-key firewall; do
            ITEMS=$(hcloud "$kind" list -o json | jq -ces '
              if length == 1 and (.[0] | type == "array" and
                all(.[]; (.id | type) == "number" and (.name | type) == "string"))
              then [.[0][] | select(.name | startswith("openclaw-staging")) | {id,name}]
              else error("Invalid cloud inventory") end')
            printf '%s: %s\n' "$kind" "$ITEMS"
            TOTAL=$((TOTAL + $(jq 'length' <<< "$ITEMS")))
          done
          for repo in pandysp/openclaw-staging-workspace pandysp/openclaw-staging-workspace-test; do
            ITEMS=$(gh api --paginate --slurp "repos/$repo/keys" | jq -ces '
              if length == 1 and (.[0] | type == "array" and length > 0 and
                all(.[]; type == "array") and
                all(.[][]; (.id | type) == "number" and (.title | type) == "string"))
              then [.[0][][] | select(.title | test("^(staging-|openclaw-staging-)")) | {id,title}]
              else error("Invalid deploy-key inventory") end')
            printf '%s: %s\n' "$repo" "$ITEMS"
            TOTAL=$((TOTAL + $(jq 'length' <<< "$ITEMS")))
          done
          if [[ "$TOTAL" != 0 ]]; then
            echo "::error::$TOTAL staging resources or deploy keys need an ownership check. Nothing was deleted."
            exit 1
          fi

      - name: Inventory staging tailnet devices
        if: always()
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: ./scripts/cleanup-staging-tailnet.sh
