# Fast pre-merge validation: parse-checks run on every PR and push.
#
# Regression history: PR #15 shipped a YAML comment with an unbalanced
# apostrophe that Ansible's Jinja2 pre-parser rejected. A bare
# --syntax-check would have blocked the merge in seconds — BUT only for
# statically-reachable tasks. A later apostrophe in cron.yml (pulled in via
# dynamic `include_tasks`) slipped past `--syntax-check playbook.yml`
# entirely and only failed at run time. The "Syntax-check included task
# files" step below closes that gap by statically importing every task file.
#
# No secrets, no Pulumi, no Tailscale, no VPS. Includes the boundary
# regression suite; allow a few minutes for dependency setup and tests.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq ruby

      # A self-contained venv, not `pip install --user`: the regression tests run
      # real Ansible under a fixture HOME, where a user-site install is invisible.
      - name: Install Ansible
        run: pipx install --include-deps --force ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible

      - name: Syntax-check playbook
        run: ansible-playbook --syntax-check -i localhost, playbook.yml
        working-directory: ansible

      # Catches unbalanced quotes / Jinja in task files that the playbook pulls
      # in via dynamic `include_tasks`, which the check above does not parse.
      - name: Syntax-check included task files
        run: ./scripts/check-task-syntax.sh

      - name: Check OpenClaw scheduler contract
        run: ./scripts/check-openclaw-contract.sh --latest-docs

      - name: Test scheduled automation reconciliation
        run: ./scripts/test-scheduled-automation.sh

      - name: Safety regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test workspace container isolation
        env:
          WORKSPACE_CONTAINER_TESTS: '1'
        run: python3 -m unittest scripts.tests.test_workspace_container -v

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # -S error blocks only on syntax breaks, not on pre-existing style
        # warnings (many SC2155 exist across the codebase today). Tightening
        # the severity later is a follow-up once those are cleaned up.
        run: shellcheck -S error scripts/*.sh
