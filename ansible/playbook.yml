---
# Bootstrap play: pre-create remote tmp dirs so become tasks don't warn.
# raw bypasses the module subsystem — no tmp dir needed to run it.
- name: Bootstrap Ansible remote directories
  hosts: openclaw
  gather_facts: false
  tags: [always]
  tasks:
    - name: Wait for SSH connectivity
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Pre-create remote tmp directories
      ansible.builtin.raw: mkdir -p /tmp/.ansible-root/tmp && chmod 0700 /tmp/.ansible-root/tmp
      become: true
      changed_when: false

- name: Provision OpenClaw gateway
  hosts: openclaw
  gather_facts: true

  pre_tasks:

    # Scheduled automation is intentionally opt-in. Validate the entire policy
    # before any role can create agents or mutate heartbeat/cron state.
    - name: Validate OpenClaw scheduler contract version
      ansible.builtin.assert:
        that:
          - openclaw_docs_reviewed_version | default('') == openclaw_version
          - (openclaw_scheduled_automation_default | type_debug) == 'bool'
        fail_msg: >-
          Scheduler contract review {{ openclaw_docs_reviewed_version | default('missing') }}
          does not match the OpenClaw pin {{ openclaw_version }}, or
          openclaw_scheduled_automation_default is not a boolean. Review the
          pinned heartbeat and cron contracts in docs/DOCS-REVIEW.md before provisioning.
      tags: [always]

    - name: Validate scheduled automation collection shapes
      ansible.builtin.assert:
        that:
          - (openclaw_agents | type_debug) == 'list'
          - (openclaw_cron_jobs | type_debug) == 'list'
        fail_msg: openclaw_agents and openclaw_cron_jobs must both be lists.
      tags: [always]

    - name: Validate agent object shapes
      ansible.builtin.assert:
        that:
          - (item | type_debug) == 'dict'
          - item.id is defined
          - item.is_default is defined
        fail_msg: Every openclaw_agents entry must be an object with id and is_default fields.
      loop: "{{ openclaw_agents }}"
      loop_control:
        label: "{{ item.id | default('(missing id)') if (item | type_debug) == 'dict' else '(non-object)' }}"
      tags: [always]

    - name: Validate agent identity and default selection
      ansible.builtin.assert:
        that:
          - openclaw_agents | length > 0
          - (openclaw_agents | map(attribute='id') | list | unique | length) == (openclaw_agents | length)
          - openclaw_agents | selectattr('is_default', 'defined') | selectattr('is_default', 'equalto', true) | list | length == 1
        fail_msg: >-
          openclaw_agents must contain unique IDs and exactly one is_default=true agent.
      tags: [always]

    - name: Validate scheduled automation agent fields
      ansible.builtin.assert:
        that:
          - (item.id | type_debug) == 'str'
          - item.id | length > 0
          - ((item.scheduled_automation_enabled | default(openclaw_scheduled_automation_default)) | type_debug) == 'bool'
          - not (item.scheduled_automation_enabled | default(openclaw_scheduled_automation_default)) or (item.deliver_to | default('') | string | length > 0)
        fail_msg: >-
          Agent '{{ item.id | default('(missing id)') }}' has invalid scheduled
          automation settings. The switch must be a boolean, and enabled agents
          need a delivery target.
      loop: "{{ openclaw_agents }}"
      loop_control:
        label: "{{ item.id | default('(missing id)') }}"
      tags: [always]

    - name: Validate cron job object shapes
      ansible.builtin.assert:
        that:
          - (item | type_debug) == 'dict'
          - item.name is defined
          - item.agent is defined
        fail_msg: Every openclaw_cron_jobs entry must be an object with name and agent fields.
      loop: "{{ openclaw_cron_jobs }}"
      loop_control:
        label: "{{ item.name | default('(missing name)') if (item | type_debug) == 'dict' else '(non-object)' }}"
      tags: [always]

    - name: Validate cron job identity
      ansible.builtin.assert:
        that:
          - (openclaw_cron_jobs | map(attribute='name') | list | unique | length) == (openclaw_cron_jobs | length)
        fail_msg: >-
          openclaw_cron_jobs names must be globally unique; duplicate names make
          live job identity and history ambiguous.
      tags: [always]

    - name: Validate cron job fields
      ansible.builtin.assert:
        that:
          - (item.name | type_debug) == 'str'
          - item.name | length > 0
          - item.agent in (openclaw_agents | map(attribute='id') | list)
          - (item.state | default('present')) in ['present', 'absent']
          - ((item.enabled | default(true)) | type_debug) == 'bool'
          - (item.state | default('present')) == 'absent' or (item.schedule is defined and item.schedule | string | length > 0)
          - (item.state | default('present')) == 'absent' or (item.message is defined and (item.message | type_debug) == 'str')
        fail_msg: >-
          Cron job '{{ item.name | default('(missing name)') }}' has invalid
          state, agent, enabled, schedule, or message fields.
      loop: "{{ openclaw_cron_jobs }}"
      loop_control:
        label: "{{ item.name | default('(missing name)') }}"
      tags: [always]

    - name: Derive scheduled automation policy by agent
      ansible.builtin.set_fact:
        _openclaw_scheduled_automation_by_agent: >-
          {{ dict(openclaw_agents | map(attribute='id') | zip(
             openclaw_agents | map(attribute='scheduled_automation_enabled', default=openclaw_scheduled_automation_default))) }}
      tags: [always]

    # --- Derived config: auto-generate from openclaw_agents × openclaw_mcp_server_types ---
    # These computed variables (_openclaw_*) replace the manual per-agent lists that were
    # previously in all.yml. Override by defining openclaw_mcp_servers or openclaw_workspaces
    # in openclaw.yml.

    # MCP servers: agents × server_types cross-product
    - name: Use manually defined MCP servers (override)
      ansible.builtin.set_fact:
        _openclaw_mcp_servers: "{{ openclaw_mcp_servers }}"
      when: openclaw_mcp_servers is defined
      tags: [always]

    - name: Initialize auto-generated MCP server list
      ansible.builtin.set_fact:
        _openclaw_mcp_servers: []
      when: openclaw_mcp_servers is not defined
      tags: [always]

    - name: Auto-generate MCP servers from server types × agents
      ansible.builtin.set_fact:
        _openclaw_mcp_servers: "{{ _openclaw_mcp_servers + [_entry] }}"
      vars:
        _name: "{{ item.0.name_prefix if item.1.id == 'main' else item.0.name_prefix ~ '-' ~ item.1.id }}"
        _cwd: "{{ '/home/ubuntu/.openclaw/workspace' if item.1.id == 'main' else '/home/ubuntu/.openclaw/workspace-' ~ item.1.id }}"
        _token_var: "{{ 'github_token' if item.1.id == 'main' else 'github_token_' ~ item.1.id }}"
        _entry: >-
          {{ {'name': _name, 'type': item.0.type, 'agent_id': item.1.id}
             | combine({'cwd': _cwd} if item.0.type in ['codex', 'claude-code', 'pi', 'qmd'] else {})
             | combine({'token_var': _token_var} if item.0.type == 'github' else {}) }}
      loop: "{{ openclaw_mcp_server_types | product(openclaw_agents) | list }}"
      loop_control:
        label: "{{ _name }}"
      when: openclaw_mcp_servers is not defined
      tags: [always]

    # Workspaces: one per agent with mechanical naming
    - name: Initialize workspace metadata
      ansible.builtin.set_fact:
        _openclaw_workspaces: []
      tags: [always]

    - name: Use manually defined workspaces (override)
      ansible.builtin.set_fact:
        _openclaw_workspaces: >-
          {{ _openclaw_workspaces + [item | dict2items | rejectattr('key', 'eq', 'deploy_key') | items2dict] }}
      loop: "{{ openclaw_workspaces | default([]) }}"
      no_log: true
      when: openclaw_workspaces is defined
      tags: [always]

    - name: Auto-generate workspaces from agents
      ansible.builtin.set_fact:
        _openclaw_workspaces: "{{ _openclaw_workspaces + [_entry] }}"
      vars:
        _repo_var: "{{ 'workspace_repo_url' if item.id == 'main' else 'workspace_' ~ item.id ~ '_repo_url' }}"
        _key_var: "{{ 'workspace_deploy_key' if item.id == 'main' else 'workspace_' ~ item.id ~ '_deploy_key' }}"
        # One canonical form inside Ansible: setup-workspace.sh writes
        # git@github.com:, older deployments store this agent's own SSH alias.
        # Any other host or alias stays as is and fails the workspace role's check.
        _entry:
          agent_id: "{{ item.id }}"
          repo_url: "{{ lookup('vars', _repo_var, default='') | regex_replace('^git@github-workspace-' ~ item.id ~ ':', 'git@github.com:') }}"
          deploy_key_var: "{{ _key_var }}"
          workspace_dir: "{{ '/home/ubuntu/.openclaw/workspace' if item.id == 'main' else '/home/ubuntu/.openclaw/workspace-' ~ item.id }}"
          ssh_alias: "github-workspace-{{ item.id }}"
          key_file: "{{ 'workspace-deploy-key' if item.id == 'main' else 'workspace-deploy-key-' ~ item.id }}"
      loop: "{{ openclaw_agents }}"
      loop_control:
        label: "{{ item.id }}"
      when: openclaw_workspaces is not defined
      tags: [always]

    # Fail loudly if any agent in `openclaw_agents` is missing its workspace<Agent>RepoUrl
    # in Pulumi config. Without it, the workspace role silently skips the agent, and
    # everything they write (daily notes, MEMORY.md, custom AGENTS.md) lives only on the
    # VPS disk with no GitHub backup. To opt out for a specific agent (rare), add it to
    # `openclaw_workspace_backup_optouts` in group_vars/openclaw.yml.
    - name: Assert all agents have GitHub workspace backup configured
      ansible.builtin.assert:
        that:
          - _agents_missing_workspace_backup | length == 0
        fail_msg: |-
          The following agent(s) are in `openclaw_agents` but have no `workspace<Agent>RepoUrl`
          set in Pulumi config: {{ _agents_missing_workspace_backup | join(', ') }}

          Their workspaces will live ONLY on the VPS disk — no GitHub backup. Fix:

            cd {{ playbook_dir }}/..
          {% for aid in _agents_missing_workspace_backup %}
            ./scripts/setup-workspace.sh {{ aid }}
          {% endfor %}
            ./scripts/provision.sh --tags workspace

          To opt out an agent (rare; data loss on VPS failure), add it to
          `openclaw_workspace_backup_optouts` in group_vars/openclaw.yml.
      vars:
        _optouts: "{{ openclaw_workspace_backup_optouts | default([]) }}"
        _agents_missing_workspace_backup: >-
          {{ _openclaw_workspaces
             | rejectattr('agent_id', 'in', _optouts)
             | selectattr('repo_url', 'eq', '')
             | map(attribute='agent_id')
             | list }}
      tags: [always]

    - name: Initialize qmd_workspaces list
      ansible.builtin.set_fact:
        qmd_workspaces: []
      tags: [always]

    - name: Derive qmd_workspaces (agents with workspace repos + assigned HTTP port + server name)
      ansible.builtin.set_fact:
        qmd_workspaces: >-
          {{ qmd_workspaces + [item | combine({
               'port': qmd_http_base_port | int + _idx,
               'server_name': 'qmd' if item.agent_id == 'main' else 'qmd-' ~ item.agent_id
             })] }}
      loop: "{{ _openclaw_workspaces | selectattr('repo_url', 'ne', '') | list }}"
      loop_control:
        index_var: _idx
        label: "{{ item.agent_id }}"
      tags: [always]

    # Tailscale WSS URL: used by telegram and post_tasks to route CLI commands through
    # Tailscale Serve instead of local loopback (broken in OpenClaw 2026.3.13).
    # See: https://github.com/openclaw/openclaw/issues/48167
    - name: Resolve Tailscale WSS URL for CLI commands
      ansible.builtin.shell: |
        FQDN=$(tailscale status --self --json 2>/dev/null | grep -o '"DNSName": *"[^"]*"' | head -1 | sed 's/.*: *"//; s/"//; s/\.$//')
        if [ -n "$FQDN" ] && [ "$FQDN" != "null" ]; then
          echo "wss://$FQDN"
        fi
      args:
        executable: /bin/bash
      register: _tailscale_wss_result
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Set Tailscale WSS URL fact
      ansible.builtin.set_fact:
        _tailscale_wss_url: "{{ _tailscale_wss_result.stdout | default('') | trim }}"
      tags: [always]

  roles:
    - { role: system,    tags: [system],    become: true }
    - { role: docker,    tags: [docker],    become: true }
    - { role: ufw,       tags: [ufw],       become: true }
    # Restore fresh workspaces before onboarding and agent services create files.
    - role: workspace
      tags: [workspace]
      when: _openclaw_workspaces | selectattr('repo_url', 'ne', '') | list | length > 0
    - { role: openclaw,  tags: [openclaw] }
    - { role: config,    tags: [config] }
    - role: agents
      tags: [agents]
      when: >-
        (telegram_bot_token is defined and telegram_bot_token | length > 0) or
        (openclaw_agents | selectattr('deliver_channel', 'defined')
          | selectattr('deliver_channel', 'equalto', 'whatsapp') | list | length > 0) or
        (discord_bot_token is defined and discord_bot_token | length > 0)
    # telegram must run immediately after agents — if sandbox runs in between,
    # agents exist without bindings and incoming messages get misrouted.
    - { role: telegram,  tags: [telegram],  when: telegram_bot_token is defined and telegram_bot_token | length > 0 }
    # whatsapp after telegram — configures WhatsApp channel for agents using deliver_channel: whatsapp.
    - role: whatsapp
      tags: [whatsapp]
      when: >-
        openclaw_agents | selectattr('deliver_channel', 'defined')
          | selectattr('deliver_channel', 'equalto', 'whatsapp') | list | length > 0
    # discord after whatsapp — configures Discord channel (bot token, guild allowlist).
    - { role: discord, tags: [discord], when: discord_bot_token is defined and discord_bot_token | length > 0 }
    # obsidian-headless syncs workspaces to Obsidian Sync cloud for phone access.
    - role: obsidian-headless
      tags: [obsidian-headless]
      when: obsidian_headless_enabled | default(false) | bool
    # qmd after obsidian-headless — needs workspace dirs from agents role, before plugins registers MCP servers.
    - { role: qmd,       tags: [qmd],       when: openclaw_mcp_adapter is defined }
    # plugins after qmd — qmd binary must exist for MCP server registration + deny rules need agents.
    - { role: plugins,   tags: [plugins],   when: openclaw_mcp_adapter is defined }
    - { role: sandbox,   tags: [sandbox] }

  post_tasks:
    # Workaround for openclaw/openclaw#6070: `openclaw config set` strips nested
    # sensitive-only objects (e.g., tools.web.search.grok, channels.discord.token)
    # on subsequent writes. Inject these keys directly into the JSON file AFTER all
    # roles have finished their `openclaw config set` calls, so nothing can strip them.
    # Runs before handlers (which restart the gateway).
    - name: Preserve sensitive nested config keys
      block:
        - name: Write sensitive keys to temp file for JSON injection
          ansible.builtin.copy:
            content: "{{ _sensitive_keys | to_json }}"
            dest: /tmp/ansible-sensitive-keys.json
            mode: "0600"
          vars:
            _sensitive_keys:
              - path: ["plugins", "entries", "xai", "config", "webSearch", "apiKey"]
                value: "{{ xai_api_key | default('') }}"
                hash_name: "xai-api-key"
              - path: ["channels", "discord", "token"]
                value: "{{ discord_bot_token | default('') }}"
                hash_name: "discord-bot-token"
          no_log: true
          changed_when: false

        - name: Inject sensitive nested keys into config JSON (openclaw#6070 workaround)
          ansible.builtin.shell: |
            set -euo pipefail
            python3 << 'PYEOF'
            import json, hashlib, os

            config_path = os.path.expanduser("~/.openclaw/openclaw.json")
            hash_dir = os.path.expanduser("~/.openclaw/.ansible-hashes")
            keys_path = "/tmp/ansible-sensitive-keys.json"
            os.makedirs(hash_dir, exist_ok=True)

            d = json.load(open(config_path))
            keys = json.load(open(keys_path))
            changed = []

            for entry in keys:
                value = entry["value"]
                if not value:
                    continue
                path_parts = entry["path"]
                hash_name = entry["hash_name"]

                obj = d
                for part in path_parts[:-1]:
                    obj = obj.setdefault(part, {})
                leaf = path_parts[-1]

                desired_hash = hashlib.sha256(value.encode()).hexdigest()
                hash_path = os.path.join(hash_dir, hash_name)
                try:
                    current_hash = open(hash_path).read().strip()
                except FileNotFoundError:
                    current_hash = ""

                if obj.get(leaf, "") == value and desired_hash == current_hash:
                    continue

                obj[leaf] = value
                with open(hash_path, "w") as f:
                    f.write(desired_hash + "\n")
                changed.append(".".join(path_parts))

            if changed:
                with open(config_path, "w") as f:
                    json.dump(d, f, indent=2)
                    f.write("\n")
                print("INJECTED: " + ", ".join(changed))
            else:
                print("OK")
            PYEOF
          args:
            executable: /bin/bash
          no_log: true
          register: sensitive_inject
          changed_when: "'INJECTED' in sensitive_inject.stdout"
          notify: restart openclaw-gateway
      rescue:
        - name: Report sensitive-key injection failure
          ansible.builtin.fail:
            msg: Sensitive-key injection failed. Check openclaw.json and file permissions; private diagnostics are withheld.
      always:
        - name: Clean up sensitive key temp file
          ansible.builtin.file:
            path: /tmp/ansible-sensitive-keys.json
            state: absent
          changed_when: false
      tags: [config, agents, discord]

    - name: Ensure openclaw-gateway is started and enabled
      ansible.builtin.systemd:
        name: openclaw-gateway
        state: started
        enabled: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/1000"
      tags: [docker, config, openclaw, sandbox, agents, plugins, qmd, whatsapp, discord]

    - name: Apply pending gateway restarts before verification
      ansible.builtin.meta: flush_handlers
      tags: [docker, config, openclaw, sandbox, agents, plugins, qmd, whatsapp, discord]

    - name: Verify restarted gateway health
      ansible.builtin.command: openclaw health --json
      environment:
        XDG_RUNTIME_DIR: "/run/user/1000"
      register: gateway_final_health
      changed_when: false
      until: >-
        gateway_final_health.rc == 0 and
        (gateway_final_health.stdout | from_json).ok | default(false) | bool
      retries: 12
      delay: 5
      no_log: true
      when: not ansible_check_mode
      tags: [docker, config, openclaw, sandbox, agents, plugins, qmd, whatsapp, discord]

    # Device approvals require an operator to verify the matching request.
    # Provisioning authority does not authorize arbitrary pending clients.
