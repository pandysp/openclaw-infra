---
# Non-secret defaults for OpenClaw provisioning.
# Secrets are passed via scripts/provision.sh from Pulumi config.

openclaw_timezone: "Europe/Berlin"
# Canonical form since 2026.6.1: anthropic/<model> + an agentRuntime.id=claude-cli
# mapping in agents.defaults.models (see openclaw_agent_models below) keeps turns on
# the claude CLI backend (Max subscription). The legacy "claude-cli/<model>" ids fail
# strict model validation (no models.providers["claude-cli"] catalog entry exists).
openclaw_model_primary: "anthropic/claude-opus-5-5"
openclaw_model_fallbacks: []
# Default heartbeat model for every agent; an agent's heartbeat_model overrides it.
openclaw_heartbeat_model: "anthropic/claude-sonnet-5-5"
openclaw_thinking_default: "high"

# Model allowlist for agents, with explicit agent-runtime mapping (protected map
# path — written with --replace, this tree is authoritative). Every model referenced
# by primary/fallbacks/heartbeat must be listed here; agentRuntime.id=claude-cli
# routes it through the claude CLI instead of the direct Anthropic API.
openclaw_agent_models:
  "anthropic/claude-opus-5-5":
    alias: "opus"
    agentRuntime:
      id: "claude-cli"
  "anthropic/claude-sonnet-5-5":
    # alias is auto-derived by the gateway and persisted; declare it so the
    # idempotency compare converges instead of rewriting every run.
    alias: "sonnet"
    agentRuntime:
      id: "claude-cli"

# CLI backend: OpenClaw shells out to the `claude` CLI binary which manages its own
# OAuth auth (Claude Max subscription). No direct Anthropic API calls for the primary model.
# The claude CLI is installed via npm (@anthropic-ai/claude-code) and reads its login from
# ~/.claude/shared/auth (the Pulumi setup token on a fresh server; see AGENTS.md Key Rotation).
# Claude Code compacts claude-cli sessions itself (OpenClaw skips its own compaction
# and memory flush for CLI turns); see claude_code_auto_compact_window below.
#
# OpenClaw's own anthropic provider catalog, for direct-API use only.
openclaw_custom_models:
  mode: "merge"
  providers:
    anthropic:
      baseUrl: "https://api.anthropic.com"
      api: "anthropic-messages"
      models:
        - id: "claude-opus-4-6"
          name: "Claude Opus 4.6"
          reasoning: true
          input: ["text", "image"]
          contextWindow: 200000
          maxTokens: 128000
# OpenClaw 2026.9.3+ supports Node >=24.16 <25 or >=26.1 (Node 26 recommended).
nodejs_major_version: 26
openclaw_version: "2026.9.9"
# Host Claude Code CLI (@anthropic-ai/claude-code) for the claude-cli model runtime.
# Update intentionally.
claude_code_version: "2.1.293"  # Opus 5.5 needs >= 2.1.280
# Claude Code compacts claude-cli sessions when the context reaches this window
# minus its own 33k buffer (check with `claude -p /context`): 305000 compacts at
# ~272k. Unset, Opus 5.5 runs until ~967k of its 1M window.
claude_code_auto_compact_window: 305000

# true runs every agent turn in its own container (apply with --tags config,claude-cli);
# false runs turns natively (apply with --tags config). Container files stay installed when off.
openclaw_claude_cli_enabled: false
openclaw_claude_cli_command: /home/ubuntu/.openclaw/claude-cli-container
# Claude flags the launcher adds to every container launch (staging: ["--tools", ""]).
# It refuses a flag OpenClaw already passes, e.g. --strict-mcp-config since 2026.9.8.
openclaw_claude_cli_extra_args: []
openclaw_claude_cli_network: openclaw-claude-cli
openclaw_claude_cli_bridge_interface: oc-claude0
openclaw_claude_cli_ipv4_subnet: 172.30.55.0/24
openclaw_claude_cli_ipv6_subnet: fd27:0c1a:c100::/64
openclaw_claude_cli_mcp_target: /home/ubuntu/.openclaw/claude-cli-mcp-target.json
# Containers reach a Mac over SSH only when a host is set (an SSH alias the
# controller can reach, e.g. "mac-air"), with the Mac account in mac_user, and
# only for agents with `mac_access: true` in openclaw_agents.
openclaw_claude_cli_mac_host: ""
openclaw_claude_cli_mac_user: ""
# Inherited variables only; provider keys stay with the host's OpenClaw tools.
openclaw_claude_cli_skill_env:
  - GROQ_API_KEY
  - GEMINI_API_KEY
  - OPENAI_API_KEY
  - NOTION_API_TOKEN
# Bump only after reviewing the versioned heartbeat + cron contracts documented
# in scripts/check-openclaw-contract.sh. Provisioning refuses scheduler changes on a mismatch.
openclaw_docs_reviewed_version: "2026.9.9"
# Agent existence never opts into autonomous work. Deployments must explicitly
# enable scheduled automation per agent in group_vars/openclaw.yml.
openclaw_scheduled_automation_default: false
# Latent cadence used only after an agent opts into scheduled automation.
openclaw_heartbeat_interval: "30m"
openclaw_agent_timeout_seconds: 1500  # 25 minutes per conversation turn (default: 600)
# Derived, not set: WhatsApp is configured (channel config, owner binding) only when an agent delivers there.
openclaw_whatsapp_used: "{{ openclaw_agents | default([]) | selectattr('deliver_channel', 'defined') | selectattr('deliver_channel', 'equalto', 'whatsapp') | list | length > 0 }}"
openclaw_elevated_default: "off"

# Exa web search is enabled when exaApiKey is set in Pulumi.
# Firecrawl's keyless web_fetch fallback runs only when local extraction fails.
openclaw_firecrawl_enabled: true

# Voice transcription (ElevenLabs Scribe v2)
# Set via: pulumi config set elevenlabsApiKey --secret
openclaw_audio_provider: "elevenlabs"
openclaw_audio_model: "scribe_v2"

# Image generation (Google Gemini)
# Set via: pulumi config set geminiApiKey --secret
openclaw_image_generation_model: "google/gemini-3-pro-image-preview"
openclaw_image_generation_fallbacks:
  - "google/gemini-3.1-flash-image-preview"

# Concurrency settings
openclaw_max_concurrent: 8
openclaw_subagents_max_concurrent: 16

# OpenClaw's own exec tool runs in the sandbox.
openclaw_exec_host: "sandbox"
openclaw_exec_mode: "full"           # No approval prompts for native or OpenClaw exec; containers supply OS containment, see SECURITY §4.

# Sandbox settings
openclaw_sandbox_mode: "all"
openclaw_sandbox_workspace_access: "rw"
openclaw_sandbox_docker_network: "bridge"
openclaw_sandbox_docker_image: "openclaw-sandbox-custom:latest"
openclaw_sandbox_read_only_root: false  # Allow runtime pip/npm/curl installs (see docs/SECURITY.md §4)
openclaw_browser_allow_host_control: false  # Allow sandboxed agents to use browser tool with target="host"

# Telegram: silently suppress error reply messages (true = user sees nothing on failure)
openclaw_telegram_silent_error_replies: true

# Force sandbox image rebuild (override with -e force_sandbox_rebuild=true)
force_sandbox_rebuild: false


# Force plugin reinstall (override with -e force_plugin_reinstall=true)
force_plugin_reinstall: false

# Force qmd reindex (override with -e force_qmd_reindex=true)
force_qmd_reindex: false

# qmd semantic search settings
# @tobilu/qmd published on npm — pin with semver
qmd_version: "2.0.1"
# Base port for qmd HTTP daemons (one per agent, assigned by position in qmd_workspaces).
# Port N+0 = first agent, N+1 = second, etc. Re-run --tags qmd,plugins if agents change.
qmd_http_base_port: 8191
# qmd collections for search. Paths are relative to the workspace root.
# qmd silently skips missing paths. Override in openclaw.yml for deployment-specific collections.
qmd_collections:
  - name: notes
    path: "notes"
    pattern: "**/*.{md,txt,csv}"
  - name: logs
    path: "logs"
    pattern: "**/*.md"
  - name: extracted-content
    path: ".scripts/extract-cache"
    pattern: "*.json"

# Agent definitions — single-agent default for new deployments.
# Override in openclaw.yml for multi-agent setups (see openclaw.yml.example).
openclaw_agents:
  - id: "main"
    is_default: true
    deliver_to: "{{ telegram_user_id | default('') }}"
    deliver_type: "dm"
    deliver_channel: "telegram"

# Legacy cron job names (removed during migration to per-agent jobs)
openclaw_legacy_cron_names:
  - "Morning Digest"
  - "Evening Review"
  - "Night Shift"
  - "Weekly Planning"
  - "Weekly Memory Maintenance"
  - "Daily Research Digest"
  - "Weekly Vault Insights"

# Per-agent cron jobs (only created when telegram is configured).
# Generic defaults for single-agent setup. Override in openclaw.yml for multi-agent.
openclaw_cron_jobs:
  - name: "main: Daily Standup"
    agent: "main"
    schedule: "30 9 * * *"
    message: "Good morning! Summarize what needs attention today."
  - name: "main: Night Shift"
    agent: "main"
    schedule: "0 23 * * *"
    message: "Night shift. Review notes, organize, triage, work through tasks. Prepare morning summary."

# MCP plugin configuration
openclaw_mcp_adapter:
  npm_package: "@pandysp/openclaw-mcp-adapter@0.1.7"
  npm_packages:
    - "@modelcontextprotocol/server-github"
  tool_prefix: true
  codex_proxy_port: 8787         # mcp-auth-proxy port (GitHub token proxy for sandbox git)
  # Note: MCP servers are auto-generated from openclaw_agents × openclaw_mcp_server_types
  # in playbook.yml pre_tasks. The 'servers' key was removed — see _openclaw_mcp_servers.

# MCP server type templates — cross-producted with openclaw_agents to auto-generate
# the per-agent MCP server list (_openclaw_mcp_servers). Each type produces one server
# per agent with mechanical naming: <name_prefix> for main, <name_prefix>-<id> for others.
openclaw_mcp_server_types:
  - type: "github"
    name_prefix: "github"
  - type: "qmd"
    name_prefix: "qmd"

# Obsidian Headless Sync (obsidian-headless npm package)
# Runs per-workspace sync daemons for near-real-time Obsidian Sync cloud access.
# Override in openclaw.yml to enable and configure per-deployment.
obsidian_headless_enabled: false
obsidian_headless_version: "0.0.14"
obsidian_headless_memory_max: "256M"
obsidian_headless_agents: []
obsidian_headless_initial_sync_timeout: 300
# Common non-vault directories to exclude from Obsidian Sync.
# Override in openclaw.yml to add workspace-specific exclusions.
obsidian_headless_excluded_folders: ".git,.venv,node_modules,.cache,.env"
# Obsidian config categories to sync. community-plugin[-data] is what carries
# community plugins to mobile (they ride git between machines, but only Obsidian
# Sync reaches the phone). Empty string disables config syncing entirely.
# Must match setup-mac-workspaces.sh OBSIDIAN_CONFIGS.
obsidian_headless_configs: "community-plugin,community-plugin-data"

# Note: openclaw_workspaces is auto-generated in playbook.yml pre_tasks from
# openclaw_agents. Override by defining openclaw_workspaces in openclaw.yml.
