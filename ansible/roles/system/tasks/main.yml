---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

# Tailscale carries the provisioning connection: upgrading it here restarted tailscaled and
# dropped the run (seen three times). Tailscale's own updater keeps it current (set below).
- name: Dist-upgrade all packages except Tailscale
  block:
    - name: Hold Tailscale during the dist-upgrade
      ansible.builtin.dpkg_selections:
        name: tailscale
        selection: hold
      changed_when: false  # released again below; the net selection does not change

    - name: Dist-upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
  always:
    - name: Release Tailscale after the dist-upgrade
      ansible.builtin.dpkg_selections:
        name: tailscale
        selection: install
      changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - jq
      - ffmpeg              # OpenClaw checks skill requirements on the host (video-frames needs it)
      - python3
      - git
      - unzip               # Required by bun installer
      - poppler-utils       # pdftotext for qmd text extraction
      - tesseract-ocr       # OCR for images (replaces macOS Vision API)
      - tesseract-ocr-deu   # German language data for tesseract
      - build-essential      # make/gcc for npm native modules (e.g., @discordjs/opus)
      - inotify-tools       # inotifywait for qmd recursive file watching
    state: present

# Provisioning no longer upgrades Tailscale (held above), so its own updater must stay on.
# Production and fresh staging hosts already had it on (2026-10-08); this keeps it that way.
- name: Let Tailscale update itself
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "$(tailscale debug prefs | jq -r '.AutoUpdate.Apply // false')" != true ]; then
        tailscale set --auto-update
        echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: tailscale_auto_update
  changed_when: "'CHANGED' in tailscale_auto_update.stdout"

- name: Check installed Node.js version
  ansible.builtin.command: node --version
  register: node_installed
  changed_when: false
  failed_when: false

# Install, or switch the NodeSource repository when the installed major differs
# from nodejs_major_version (OpenClaw 2026.9.3+ refuses Node 25).
- name: Install Node.js {{ nodejs_major_version }} via NodeSource
  when: node_installed.rc != 0 or (node_installed.stdout | regex_search('^v([0-9]+)', '\\1') | first) != (nodejs_major_version | string)
  block:
    - name: Add NodeSource GPG key and repository
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_major_version }}.x | bash -
      args:
        executable: /bin/bash

    - name: Install nodejs package
      ansible.builtin.apt:
        name: nodejs
        state: latest
        update_cache: true

- name: Verify Node.js major version
  ansible.builtin.command: node --version
  register: node_final
  changed_when: false
  failed_when: (node_final.stdout | regex_search('^v([0-9]+)', '\\1') | first) != (nodejs_major_version | string)
  when: not ansible_check_mode

- name: Configure npm global prefix for ubuntu user
  ansible.builtin.shell: |
    mkdir -p /home/ubuntu/.npm-global
    npm config set prefix "/home/ubuntu/.npm-global"
  args:
    executable: /bin/bash
    creates: /home/ubuntu/.npm-global
  become: false

- name: Set git default branch to main
  community.general.git_config:
    name: init.defaultBranch
    value: main
    scope: global
  become: false

- name: Increase inotify watch limit for qmd watchers
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    state: present
    sysctl_set: true

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Configure unattended-upgrades (no auto-reboot)
  ansible.builtin.copy:
    content: "Unattended-Upgrade::Automatic-Reboot \"false\";\n"
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-custom
    mode: "0644"

# --- Swap (defense-in-depth against OOM) ---

- name: Check if swapfile exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create 2 GB swapfile
  ansible.builtin.command: fallocate -l 2G /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Set swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
    owner: root
    group: root

- name: Format swapfile
  ansible.builtin.command: mkswap /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Check if swap is active
  ansible.builtin.shell: swapon --show=NAME --noheadings | grep -q '/swapfile'
  args:
    executable: /bin/bash
  register: swap_active
  changed_when: false
  failed_when: swap_active.rc == 2

- name: Enable swapfile
  ansible.builtin.command: swapon /swapfile
  when: swap_active.rc != 0
  changed_when: true

- name: Add swapfile to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile'
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Set vm.swappiness to 1 (swap only to avoid OOM)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "1"
    state: present
    sysctl_set: true

# --- Cloud-init secret cleanup ---
# Cloud-init logs and user-data cache may contain the Tailscale auth key.
# Shred them on every provision run to limit exposure window.

- name: Shred cloud-init log containing secrets
  ansible.builtin.shell: shred -u /var/log/cloud-init-openclaw.log 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Shred cached user-data files containing secrets
  ansible.builtin.shell: shred -u /var/lib/cloud/instances/*/user-data.txt 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false
