---
# Install and configure the mcp-adapter plugin with per-agent MCP servers
# (GitHub, qmd, node-exec).
# Skipped entirely if openclaw_mcp_adapter is not defined (in playbook.yml).
# Force reinstall with: -e force_plugin_reinstall=true

- name: Ensure npm global prefix is configured
  ansible.builtin.shell: |
    set -euo pipefail
    PREFIX=$(npm config get prefix 2>/dev/null || echo "")
    if [ -z "$PREFIX" ] || [ "$PREFIX" = "/usr/local" ] || [ "$PREFIX" = "/usr" ]; then
        npm config set prefix "$HOME/.npm-global"
    fi
    npm config get prefix
  args:
    executable: /bin/bash
  register: npm_prefix
  changed_when: false
  check_mode: false

- name: Ensure npm global bin is in PATH profile
  ansible.builtin.lineinfile:
    path: /home/ubuntu/.profile
    line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
    state: present

- name: Determine which npm packages to install
  ansible.builtin.set_fact:
    mcp_npm_packages: >-
      {{ openclaw_mcp_adapter.npm_packages
         | reject('equalto', 'node-exec-mcp')
         | list
         + (['node-exec-mcp'] if (node_exec_enabled | default(false)) else []) }}

- name: Install MCP server npm packages globally
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  environment:
    PATH: "{{ (npm_prefix.stdout_lines | last) | trim }}/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ mcp_npm_packages }}"

- name: Resolve mcp-server-github binary path
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ (npm_prefix.stdout_lines | last) | trim }}/bin:$PATH"
    BINARY=$(which mcp-server-github) || {
        echo "ERROR: mcp-server-github not found in PATH after npm install"
        echo "Expected at: {{ (npm_prefix.stdout_lines | last) | trim }}/bin/mcp-server-github"
        exit 1
    }
    echo "$BINARY"
  args:
    executable: /bin/bash
  register: github_mcp_binary
  changed_when: false

- name: Resolve qmd binary path
  ansible.builtin.shell: PATH="$HOME/.bun/bin:$PATH" which qmd
  args:
    executable: /bin/bash
  register: qmd_mcp_binary
  changed_when: false
  failed_when: false

- name: Assert qmd binary exists when qmd servers are configured
  ansible.builtin.assert:
    that: qmd_mcp_binary.rc == 0
    fail_msg: >-
      qmd binary not found but qmd servers are configured in group_vars.
      Run the qmd role first: ./scripts/provision.sh --tags qmd,plugins
  when: _openclaw_mcp_servers | selectattr('type', 'equalto', 'qmd') | list | length > 0

- name: Set npm prefix bin path fact
  ansible.builtin.set_fact:
    npm_prefix_bin: "{{ (npm_prefix.stdout_lines | last) | trim }}/bin"

- name: Resolve node-exec-mcp binary path
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ npm_prefix_bin }}:$PATH"
    BINARY=$(which node-exec-mcp) || {
        echo "ERROR: node-exec-mcp not found in PATH after npm install"
        echo "Expected at: {{ npm_prefix_bin }}/node-exec-mcp"
        exit 1
    }
    echo "$BINARY"
  args:
    executable: /bin/bash
  register: node_exec_mcp_binary
  changed_when: false
  when:
    - node_exec_enabled | default(false)
    - _openclaw_mcp_servers | selectattr('type', 'equalto', 'node-exec') | list | length > 0

- name: Set proxy_required fact
  ansible.builtin.set_fact:
    proxy_required: >-
      {%- set ns = namespace(found=false) -%}
      {%- for srv in _openclaw_mcp_servers | selectattr('type', 'equalto', 'github') -%}
        {%- if lookup('vars', srv.token_var, default='') | length > 0 -%}
          {%- set ns.found = true -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.found }}

- name: Ensure GitHub tokens directory exists
  ansible.builtin.file:
    path: /home/ubuntu/.openclaw/github-tokens
    state: directory
    mode: "0700"
  when: proxy_required | bool

- name: Write per-agent GitHub token files
  ansible.builtin.copy:
    content: "{{ lookup('vars', item.token_var, default='') }}"
    dest: "/home/ubuntu/.openclaw/github-tokens/{{ item.agent_id }}"
    mode: "0600"
  no_log: true
  loop: "{{ _openclaw_mcp_servers | selectattr('type', 'equalto', 'github') | list }}"
  loop_control:
    label: "{{ item.agent_id }}"
  when: lookup('vars', item.token_var, default='') | length > 0
  register: github_tokens_changed
  tags: [github_tokens]

- name: Get codex-proxy-net gateway IP
  ansible.builtin.shell: |
    docker network inspect codex-proxy-net --format '{{ '{{' }}range .IPAM.Config{{ '}}{{' }}.Gateway{{ '}}{{' }}end{{ '}}' }}'
  args:
    executable: /bin/bash
  register: codex_proxy_net_info
  changed_when: false
  when: proxy_required | bool

- name: Set codex proxy gateway IP fact
  ansible.builtin.set_fact:
    codex_proxy_gateway_ip: "{{ codex_proxy_net_info.stdout | trim }}"
  when: proxy_required | bool

- name: Get Docker bridge gateway IP
  ansible.builtin.shell: |
    docker network inspect bridge --format '{{ '{{' }}range .IPAM.Config{{ '}}{{' }}.Gateway{{ '}}{{' }}end{{ '}}' }}'
  args:
    executable: /bin/bash
  register: docker_bridge_info
  changed_when: false
  when: proxy_required | bool

- name: Allow Docker bridge containers to reach proxy port (sandbox git push)
  become: true
  community.general.ufw:
    rule: allow
    from_ip: "{{ docker_bridge_info.stdout | trim | regex_replace('\\.[0-9]+$', '.0/16') }}"
    to_port: "{{ openclaw_mcp_adapter.codex_proxy_port }}"
    proto: tcp
    comment: "sandbox git push via proxy"
  when:
    - proxy_required | bool
    - docker_bridge_info.stdout | default('') | trim | length > 0

- name: Deploy mcp-auth-proxy
  when: proxy_required | bool
  block:
    - name: Ensure systemd user directory exists
      ansible.builtin.file:
        path: /home/ubuntu/.config/systemd/user
        state: directory
        mode: "0755"

    - name: Template mcp-auth-proxy.js
      ansible.builtin.template:
        src: mcp-auth-proxy.js.j2
        dest: /home/ubuntu/.openclaw/mcp-auth-proxy.js
        mode: "0644"
      register: proxy_js_changed

    - name: Template mcp-auth-proxy systemd service
      ansible.builtin.template:
        src: mcp-auth-proxy.service.j2
        dest: /home/ubuntu/.config/systemd/user/mcp-auth-proxy.service
        mode: "0644"
      register: proxy_service_changed

    - name: Enable and start mcp-auth-proxy
      ansible.builtin.systemd:
        name: mcp-auth-proxy
        enabled: true
        state: "{{ 'restarted' if (proxy_js_changed is changed or proxy_service_changed is changed) else 'started' }}"
        scope: user
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: /run/user/1000

    - name: Wait for mcp-auth-proxy to be ready
      ansible.builtin.shell: |
        curl -sf "http://{{ codex_proxy_gateway_ip }}:{{ openclaw_mcp_adapter.codex_proxy_port }}/health"
      args:
        executable: /bin/bash
      register: proxy_health
      retries: 5
      delay: 2
      until: proxy_health.rc == 0
      changed_when: false

- name: Ensure agent workspace directories exist for git proxy config
  ansible.builtin.file:
    path: "{{ item.workspace_dir }}"
    state: directory
    mode: "0755"
  loop: "{{ _openclaw_workspaces }}"
  loop_control:
    label: "{{ item.agent_id }}"
  when:
    - codex_proxy_gateway_ip is defined
    - lookup('vars', (_openclaw_mcp_servers | selectattr('type', 'equalto', 'github') | selectattr('agent_id', 'equalto', item.agent_id) | map(attribute='token_var') | first | default('_undefined')), default='') | length > 0

- name: Write per-agent workspace .git-proxy-config files
  ansible.builtin.copy:
    content: |
      [url "http://{{ codex_proxy_gateway_ip }}:{{ openclaw_mcp_adapter.codex_proxy_port }}/github-{{ item.agent_id }}/"]
          insteadOf = https://github.com/
          insteadOf = git@github.com:
          insteadOf = git@{{ item.ssh_alias }}:
    dest: "{{ item.workspace_dir }}/.git-proxy-config"
    mode: "0644"
  loop: "{{ _openclaw_workspaces }}"
  loop_control:
    label: "{{ item.agent_id }}"
  when:
    - codex_proxy_gateway_ip is defined
    - lookup('vars', (_openclaw_mcp_servers | selectattr('type', 'equalto', 'github') | selectattr('agent_id', 'equalto', item.agent_id) | map(attribute='token_var') | first | default('_undefined')), default='') | length > 0

- name: Validate token variable names are defined
  ansible.builtin.assert:
    that:
      - item.token_var in hostvars[inventory_hostname]
    fail_msg: >-
      Server '{{ item.name }}' references token_var '{{ item.token_var }}'
      which is not a defined variable. Check group_vars/all.yml and provision.sh.
    quiet: true
  loop: "{{ _openclaw_mcp_servers | selectattr('token_var', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure mcp-adapter plugin
  block:
    - name: Write server tokens to temp files (de-duplicated by token_var)
      ansible.builtin.copy:
        content: "{{ lookup('vars', item, default='') }}"
        dest: "/tmp/ansible-mcp-token-{{ item }}"
        mode: "0600"
      no_log: true
      changed_when: false
      loop: "{{ _openclaw_mcp_servers | selectattr('token_var', 'defined') | map(attribute='token_var') | unique | list }}"

    - name: Build and write plugin config JSON
      ansible.builtin.shell: |
        set -euo pipefail
        GITHUB_BINARY="{{ github_mcp_binary.stdout | trim }}"
        TOOL_PREFIX='{{ openclaw_mcp_adapter.tool_prefix | to_json }}'
        # Build servers array
        SERVERS="[]"

        # GitHub servers — only include when token is non-empty
        {% for srv in _openclaw_mcp_servers | selectattr('type', 'equalto', 'github') %}
        TOKEN_FILE="/tmp/ansible-mcp-token-{{ srv.token_var }}"
        if [ ! -f "$TOKEN_FILE" ]; then
            echo "ERROR: Token file $TOKEN_FILE is missing — write task may have failed"
            exit 1
        fi
        SERVERS=$(printf '%s' "$SERVERS" | jq --arg name "{{ srv.name }}" \
            --arg cmd "$GITHUB_BINARY" --rawfile token "$TOKEN_FILE" \
            '($token | sub("\\n+$"; "")) as $token |
             if $token == "" then . else
             . + [{name: $name, transport: "stdio", command: $cmd, env: {GITHUB_PERSONAL_ACCESS_TOKEN: $token}}] end')
        {% endfor %}

        {% if qmd_workspaces | length > 0 %}
        # qmd servers — HTTP daemon mode (decoupled from gateway lifecycle)
        # Port assignment positional over qmd_workspaces list, must match qmd role.
        QMD_BINARY="{{ (qmd_mcp_binary.stdout | default('')) | trim }}"
        if [ -n "$QMD_BINARY" ] && [ -x "$QMD_BINARY" ]; then
        {% for ws in qmd_workspaces %}
            SERVERS=$(echo "$SERVERS" | jq --arg name "{{ ws.server_name }}" \
                --arg url "http://localhost:{{ ws.port }}/mcp" \
                '. + [{name: $name, transport: "http", url: $url, allowPrivateUrls: true, timeout: 300000}]')
        {% endfor %}
        else
            echo "NOTE: qmd binary not found, skipping qmd MCP servers"
        fi
        {% endif %}

        {% if node_exec_enabled | default(false) %}
        # node-exec: Mac shell access via openclaw nodes run (no Docker, no credentials)
        NODE_EXEC_BINARY="{{ (node_exec_mcp_binary.stdout | default('')) | trim }}"
        OPENCLAW_BIN=$(which openclaw 2>/dev/null || echo "")
        NODE_ID=$(jq -r '.tools.exec.node // empty' /home/ubuntu/.openclaw/openclaw.json 2>/dev/null || echo "")
        # In 2026.3.13+, nodes is owner-only. Loopback shared-token auth lacks owner scope.
        # Route through Tailscale Serve so the CLI gets full auth via allowTailscale.
        GW_URL="{{ _tailscale_wss_url }}"
        {% for srv in _openclaw_mcp_servers | selectattr('type', 'equalto', 'node-exec') %}
        if [ -n "$NODE_ID" ] && [ -n "$OPENCLAW_BIN" ] && [ -x "$NODE_EXEC_BINARY" ]; then
            SERVERS=$(echo "$SERVERS" | jq --arg name "{{ srv.name }}" \
                --arg cmd "$NODE_EXEC_BINARY" \
                --arg node_id "$NODE_ID" \
                --arg openclaw_bin "$OPENCLAW_BIN" \
                --slurpfile gateway_config /home/ubuntu/.openclaw/openclaw.json \
                --arg gw_url "$GW_URL" \
                'if ($gateway_config | length) != 1 or
                    ($gateway_config[0].gateway.auth.token | type != "string" or length == 0) then
                   error("Expected a gateway auth token for node-exec")
                 else . + [{name: $name, transport: "stdio", command: $cmd, env: {NODE_ID: $node_id, OPENCLAW_BIN: $openclaw_bin, XDG_RUNTIME_DIR: "/run/user/1000", OPENCLAW_GATEWAY_URL: $gw_url, OPENCLAW_GATEWAY_TOKEN: $gateway_config[0].gateway.auth.token, OPENCLAW_LOG_LEVEL: "error", DEFAULT_CWD: "/private/tmp"}}] end')
        else
            echo "NOTE: Skipping node-exec MCP servers (node_id='${NODE_ID}', binary='${NODE_EXEC_BINARY}')" >&2
        fi
        {% endfor %}
        {% else %}
        echo "NOTE: Node exec disabled (node_exec_enabled=false in group_vars/all.yml)" >&2
        {% endif %}

        # Build final config
        test ! -L /tmp/ansible-plugin-config
        install -m 600 /dev/null /tmp/ansible-plugin-config
        test -f /tmp/ansible-plugin-config && test -O /tmp/ansible-plugin-config
        printf '%s' "$SERVERS" | jq --argjson prefix "$TOOL_PREFIX" \
            '{toolPrefix: $prefix, servers: .}' > /tmp/ansible-plugin-config
      args:
        executable: /bin/bash
      changed_when: false
      # Inputs and intermediate JSON contain credentials, including on error paths.
      no_log: true

    - name: Validate desired plugin configuration before maintenance
      ansible.builtin.command:
        argv:
          - jq
          - -es
          - 'length == 1 and (.[0] | type == "object")'
          - /tmp/ansible-plugin-config
      changed_when: false
      no_log: true

    - name: Read installed MCP adapter metadata
      ansible.builtin.shell: |
        set -euo pipefail
        openclaw plugins list --json | jq -ce '
          [.plugins[] | select(.id == "openclaw-mcp-adapter")] |
          if length == 0 then {version: ""}
          elif length == 1 then .[0] | {version, rootDir}
          else error("Multiple MCP adapter installations") end'
      args:
        executable: /bin/bash
      register: mcp_install
      changed_when: false

    - name: Save global plugin loading policy
      ansible.builtin.command:
        argv:
          - jq
          - -ce
          - '(.plugins // {}) | {present: has("enabled"), enabled: .enabled}'
          - /home/ubuntu/.openclaw/openclaw.json
      register: mcp_plugin_policy
      changed_when: false
      no_log: true

    # Installation auto-enables its entry. The global switch keeps native CLI
    # loads from registering the new adapter before preparation has completed.
    - name: Stop gateway for exclusive MCP maintenance
      ansible.builtin.command:
        argv: [openclaw, gateway, stop, --json]
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      register: mcp_gateway_stopped
      notify: restart openclaw-gateway

    - name: Disable plugin loading during MCP maintenance
      ansible.builtin.command:
        argv: [openclaw, config, set, plugins.enabled, 'false']
      register: mcp_loading_disabled
      no_log: true

    - name: Install plugin from npm
      ansible.builtin.command:
        argv:
          - openclaw
          - plugins
          - install
          - --force
          - --pin
          - '{{ openclaw_mcp_adapter.npm_package }}'
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      no_log: true
      when: >-
        (mcp_install.stdout | from_json).version != openclaw_mcp_adapter.npm_package.split('@')[-1]
        or force_plugin_reinstall | default(false) | bool

    - name: Prepare MCP tool cache and contracts
      ansible.builtin.shell: |
        set -euo pipefail
        PLUGIN_DIR=$(openclaw plugins inspect openclaw-mcp-adapter --json |
          jq -er '.install.installPath | select(type == "string" and length > 0)')
        node "$PLUGIN_DIR/dist/prepare.js" < /tmp/ansible-plugin-config
      args:
        executable: /bin/bash
      register: mcp_preparation
      changed_when: (mcp_preparation.stdout | from_json).changed | bool
      no_log: true

    - name: Set plugin config and enable
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        # Compare and apply the config and enabled state together.
        CONFIG_DIFFERS=$(jq -ner --slurpfile desired /tmp/ansible-plugin-config \
            --slurpfile current /home/ubuntu/.openclaw/openclaw.json '
            if ($desired | length) != 1 or ($current | length) != 1 or
                ($desired[0] | type) != "object" or ($current[0] | type) != "object" then
              error("Expected one desired and one current config object")
            elif $desired[0] == $current[0].plugins.entries["openclaw-mcp-adapter"].config and
                $current[0].plugins.entries["openclaw-mcp-adapter"].enabled == true then "no"
            else "yes" end')
        if [ "$CONFIG_DIFFERS" = "yes" ]; then
            jq '{plugins: {entries: {"openclaw-mcp-adapter": {config: ., enabled: true}}}}' /tmp/ansible-plugin-config |
                openclaw config patch --stdin --replace-path plugins.entries.openclaw-mcp-adapter.config
            echo "UPDATED"
        else
            echo "OK"
        fi
      args:
        executable: /bin/bash
      no_log: true
      register: plugin_config_result
      changed_when: "'UPDATED' in plugin_config_result.stdout"
      notify: restart openclaw-gateway

    - name: Restore global plugin loading policy after preparation
      ansible.builtin.command:
        argv: >-
          {{ ['openclaw', 'config', 'set', 'plugins.enabled',
              (mcp_plugin_policy.stdout | from_json).enabled | to_json]
             if (mcp_plugin_policy.stdout | from_json).present
             else ['openclaw', 'config', 'unset', 'plugins.enabled'] }}
      no_log: true

    # tools.sandbox.tools.allow has one writer, the config role, which lists the
    # adapter whenever it is declared. A second writer here re-sorted it every run.

    - name: Verify plugin config was applied
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        ENABLED=$(jq -r '.plugins.entries["openclaw-mcp-adapter"].enabled // false' /home/ubuntu/.openclaw/openclaw.json 2>/dev/null)
        if [ "$ENABLED" != "true" ]; then
            echo "ERROR: Plugin enabled state is '$ENABLED', expected 'true'"
            exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify MCP adapter has servers configured
      ansible.builtin.shell: |
        set -euo pipefail
        SERVERS_COUNT=$(jq '.plugins.entries["openclaw-mcp-adapter"].config.servers | length' \
          /home/ubuntu/.openclaw/openclaw.json 2>/dev/null || echo "0")
        EXPECTED={{ _openclaw_mcp_servers | length }}
        if [ "$SERVERS_COUNT" -eq 0 ]; then
            echo "FATAL: MCP adapter has 0 servers configured (expected ~$EXPECTED)"
            exit 1
        fi
        echo "OK: $SERVERS_COUNT servers configured (expected ~$EXPECTED)"
      args:
        executable: /bin/bash
      changed_when: false

  rescue:
    - name: Keep the failed adapter disabled while restoring other plugins
      when: mcp_loading_disabled is defined and mcp_loading_disabled is succeeded
      block:
        - name: Disable adapter after failed maintenance
          ansible.builtin.command:
            argv: [openclaw, config, set, plugins.entries.openclaw-mcp-adapter.enabled, 'false']
          no_log: true

        - name: Restore global plugin loading policy after failure
          ansible.builtin.command:
            argv: >-
              {{ ['openclaw', 'config', 'set', 'plugins.enabled',
                  (mcp_plugin_policy.stdout | from_json).enabled | to_json]
                 if (mcp_plugin_policy.stdout | from_json).present
                 else ['openclaw', 'config', 'unset', 'plugins.enabled'] }}
          no_log: true

    - name: Restore gateway service after failed MCP maintenance
      when: mcp_gateway_stopped is defined and mcp_gateway_stopped is succeeded
      ansible.builtin.command:
        argv: [openclaw, gateway, start, --json]
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      no_log: true

    - name: Report failed MCP maintenance
      ansible.builtin.fail:
        msg: >-
          MCP configuration failed at {{ ansible_failed_task.name }}.
          If maintenance stopped the gateway, it has been started again.
          The adapter stays disabled after failed preparation; fix the failure and rerun
          the plugins role. Private diagnostics are withheld.

  always:
    - name: Clean up plugin config temp file
      ansible.builtin.file:
        path: /tmp/ansible-plugin-config
        state: absent
      changed_when: false

    - name: Clean up token temp files
      ansible.builtin.file:
        path: "/tmp/ansible-mcp-token-{{ item }}"
        state: absent
      changed_when: false
      loop: "{{ _openclaw_mcp_servers | selectattr('token_var', 'defined') | map(attribute='token_var') | unique | list }}"

- name: Flush handlers to restart gateway before verification
  ansible.builtin.meta: flush_handlers

- name: Wait for gateway to stabilize after plugin config
  ansible.builtin.pause:
    seconds: 5

- name: Verify gateway is active after plugin config
  ansible.builtin.command: systemctl --user is-active openclaw-gateway
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  register: gateway_active_check
  retries: 8
  delay: 5
  until: gateway_active_check.rc == 0
  changed_when: false

- name: Check gateway logs for mcp-adapter errors
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    LOGS=$(journalctl --user -u openclaw-gateway --since "30 seconds ago" --no-pager)
    if echo "$LOGS" | grep -qi "mcp.*error\|error.*mcp\|failed.*mcp-adapter\|docker.*error\|container.*failed\|image.*not found"; then
        echo "ERROR: Gateway logs contain MCP adapter errors:"
        echo "$LOGS" | grep -i "mcp"
        exit 1
    fi
    echo "$LOGS" | grep -i "mcp" || echo "No mcp-adapter log entries yet (normal for lazy-loaded plugins)"
  args:
    executable: /bin/bash
  register: mcp_logs
  changed_when: false

- name: Show mcp-adapter log status
  ansible.builtin.debug:
    var: mcp_logs.stdout_lines

# --- Per-agent MCP tool scoping ---
# Each agent denies all MCP server tool prefixes except its own.
# Glob patterns use server name + "_*" suffix (e.g. "github-manon_*", "qmd-tl_*").
# Safe because toolPrefix uses "_" while server names use "-" as separator,
# so "github_*" cannot match "github-manon_*". Server names must never contain "_".
# e.g. agent "main" gets deny: ["github-manon_*", "github-tl_*", "qmd-manon_*", "qmd-tl_*", ...]

- name: Validate server agent_id values match defined agents
  ansible.builtin.assert:
    that:
      - item.agent_id in (openclaw_agents | map(attribute='id') | list)
    fail_msg: >-
      Server '{{ item.name }}' has agent_id '{{ item.agent_id }}'
      which does not match any agent in openclaw_agents.
      Valid agent IDs: {{ openclaw_agents | map(attribute='id') | list }}
    quiet: true
  loop: "{{ _openclaw_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Get agent list for index resolution
  ansible.builtin.shell: |
    jq -c '.agents.list // []' /home/ubuntu/.openclaw/openclaw.json
  args:
    executable: /bin/bash
  register: agents_list_json
  changed_when: false

- name: Write agents list to temp file for deny rules
  ansible.builtin.copy:
    content: "{{ agents_list_json.stdout }}"
    dest: /tmp/ansible-agents-list.json
    mode: "0600"
  changed_when: false

- name: Set per-agent tool deny rules for MCP tools
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    AGENTS_JSON=$(cat /tmp/ansible-agents-list.json)
    AGENT_INDEX=$(echo "$AGENTS_JSON" | jq -r 'to_entries[] | select(.value.id == "{{ item.id }}") | .key')
    if [ -z "$AGENT_INDEX" ]; then
        echo "SKIP: Agent '{{ item.id }}' not found in agents list"
        exit 0
    fi
    CURRENT=$(jq -c ".agents.list[${AGENT_INDEX}].tools.deny // []" /home/ubuntu/.openclaw/openclaw.json 2>/dev/null) || CURRENT="[]"
    DESIRED='{{ deny_list | to_json }}'
    C_NORM=$(echo "$CURRENT" | jq -cS 'sort' 2>/dev/null || echo "PARSE_FAIL")
    D_NORM=$(echo "$DESIRED" | jq -cS 'sort')
    if [ "$C_NORM" != "PARSE_FAIL" ] && [ "$C_NORM" = "$D_NORM" ]; then
        echo "OK"
    else
        openclaw config set "agents.list.${AGENT_INDEX}.tools.deny" --json "$DESIRED"
        echo "UPDATED"
    fi
  args:
    executable: /bin/bash
  vars:
    deny_list: >-
      {{ _openclaw_mcp_servers
         | rejectattr('agent_id', 'equalto', item.id)
         | map(attribute='name')
         | map('regex_replace', '$', '_*')
         | list }}
  loop: "{{ openclaw_agents }}"
  loop_control:
    label: "{{ item.id }}"
  register: deny_result
  changed_when: "'UPDATED' in deny_result.stdout"
  notify: restart openclaw-gateway

- name: Clean up agents list temp file
  ansible.builtin.file:
    path: /tmp/ansible-agents-list.json
    state: absent
  changed_when: false

# --- Disable built-in memorySearch when qmd servers are registered ---
# Moved here from qmd role (Fix #2): only disable AFTER qmd MCP servers are
# confirmed in the plugin config. If provisioning fails between qmd and plugins,
# agents still have memorySearch as fallback.

- name: Check if qmd servers are in plugin config
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    QMD_COUNT=$(jq '[.plugins.entries["openclaw-mcp-adapter"].config.servers[]? | select(.name | startswith("qmd"))] | length' /home/ubuntu/.openclaw/openclaw.json 2>/dev/null || echo "0")
    echo "$QMD_COUNT"
  args:
    executable: /bin/bash
  register: qmd_server_count
  changed_when: false

- name: Check current memorySearch state
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    # The jq // operator treats false as "missing" and returns the RHS, so we
    # use an explicit null check to distinguish false from an absent key.
    RESULT=$(jq -r '.agents.defaults.memorySearch.enabled | if . == null then "unset" else tostring end' /home/ubuntu/.openclaw/openclaw.json 2>/dev/null || echo "unset")
    echo "$RESULT"
  args:
    executable: /bin/bash
  register: memory_search_state
  changed_when: false
  when: (qmd_server_count.stdout | int) > 0

- name: Disable built-in memorySearch (replaced by qmd)
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    openclaw config set agents.defaults.memorySearch.enabled false
  args:
    executable: /bin/bash
  when:
    - (qmd_server_count.stdout | int) > 0
    - memory_search_state.stdout != "false"
  notify: restart openclaw-gateway
