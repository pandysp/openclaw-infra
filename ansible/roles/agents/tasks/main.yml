---
- name: Verify installed OpenClaw heartbeat contract
  ansible.builtin.shell: |
    set -euo pipefail
    INSTALLED=$(openclaw --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
    if [ "$INSTALLED" != "{{ openclaw_version }}" ]; then
      echo "ERROR: installed OpenClaw $INSTALLED does not match IaC pin {{ openclaw_version }}" >&2
      exit 1
    fi
    openclaw config validate --help >/dev/null || {
      echo "ERROR: OpenClaw {{ openclaw_version }} lacks required config validate" >&2
      exit 1
    }
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Get existing agents
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    if RAW=$(openclaw agents list --json 2>/dev/null); then
        :
    else
        RC=$?
        echo "ERROR: openclaw agents list failed with exit $RC; raw output withheld" >&2
        exit "$RC"
    fi
    CLEAN=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
    if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$CLEAN"; then
        echo "ERROR: openclaw agents list returned invalid JSON (expected an array)" >&2
        exit 1
    fi
    printf '%s\n' "$CLEAN"
  args:
    executable: /bin/bash
  register: existing_agents
  changed_when: false
  check_mode: false

- block:
    - name: Write existing agents JSON to temp file
      ansible.builtin.copy:
        content: "{{ existing_agents.stdout }}"
        dest: /tmp/ansible_existing_agents.json
        mode: '0600'
      changed_when: false
      check_mode: false

    - name: Create non-default agents
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        set +e
        jq -e --arg id {{ item.id | quote }} '.[] | select(.id == $id)' /tmp/ansible_existing_agents.json > /dev/null 2>&1
        JQ_RC=$?
        set -e
        if [ "$JQ_RC" -eq 0 ]; then
            echo "Agent {{ item.id }} already exists"
        elif [ "$JQ_RC" -eq 1 ]; then
            openclaw agents add {{ item.id | quote }} --non-interactive --workspace "/home/ubuntu/.openclaw/workspace-{{ item.id }}"
        else
            echo "ERROR: could not query validated agents JSON for {{ item.id }} (jq exit $JQ_RC)" >&2
            exit 1
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: agent_create
      changed_when: "'already exists' not in agent_create.stdout"
      notify: restart openclaw-gateway
  always:
    - name: Clean up existing agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_existing_agents.json
        state: absent
      changed_when: false
      check_mode: false

- name: Refresh agent list for config targeting
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    if RAW=$(openclaw agents list --json 2>/dev/null); then
        :
    else
        RC=$?
        echo "ERROR: openclaw agents list failed with exit $RC; raw output withheld" >&2
        exit "$RC"
    fi
    CLEAN=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
    if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$CLEAN"; then
        echo "ERROR: openclaw agents list returned invalid JSON (expected an array)" >&2
        exit 1
    fi
    printf '%s\n' "$CLEAN"
  args:
    executable: /bin/bash
  register: agents_current
  changed_when: false
  check_mode: false

# The agents role is the only heartbeat writer. A safe 0m global default means
# omission can never opt an agent into OpenClaw's upstream 30m default.
- name: Set safe global heartbeat defaults
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    DESIRED='{{ _heartbeat_defaults | to_json }}'
    CURRENT=$(openclaw config get "agents.defaults.heartbeat" 2>&1 | sed -E '/^\[[A-Za-z][^]]*\]/d') || {
        if echo "$CURRENT" | grep -qiE '^Config path not found:'; then
            CURRENT="{}"
        else
            echo "ERROR: could not read agents.defaults.heartbeat" >&2
            exit 1
        fi
    }
    if ! D_NORM=$(echo "$DESIRED" | jq -e -cS 'select(type == "object")'); then
        echo "ERROR: generated agents.defaults.heartbeat is not a JSON object" >&2
        exit 1
    fi
    if ! C_NORM=$(echo "$CURRENT" | jq -e -cS 'select(type == "object")' 2>/dev/null); then
        echo "ERROR: existing agents.defaults.heartbeat is unreadable; refusing to overwrite it" >&2
        exit 1
    fi
    if [ "$C_NORM" = "$D_NORM" ]; then
        echo "OK"
    else
        {% if not ansible_check_mode %}
        openclaw config set "agents.defaults.heartbeat" --json "$DESIRED"
        {% endif %}
        echo "UPDATED: safe global heartbeat defaults"
    fi
  args:
    executable: /bin/bash
  vars:
    _heartbeat_defaults: >-
      {{ {'every': '0m', 'model': 'anthropic/claude-sonnet-4-6', 'directPolicy': 'allow'}
         | combine({'activeHours': openclaw_heartbeat_active_hours}
           if openclaw_heartbeat_active_hours is defined and openclaw_heartbeat_active_hours else {}) }}
  register: heartbeat_defaults_result
  changed_when: "'UPDATED' in (heartbeat_defaults_result.stdout | default(''))"
  check_mode: false
  notify: restart openclaw-gateway

- name: Set default agent sandbox mode
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    CURRENT=$(openclaw config get "agents.defaults.sandbox.mode" 2>/dev/null | sed -E '/^\[[A-Za-z][^]]*\]/d') || CURRENT=""
    DESIRED="{{ _default_agent.sandbox_mode }}"
    if [ "$CURRENT" = "$DESIRED" ]; then
        echo "OK"
    else
        openclaw config set "agents.defaults.sandbox.mode" "$DESIRED"
        echo "UPDATED: default agent sandbox.mode → {{ _default_agent.sandbox_mode }}"
    fi
  args:
    executable: /bin/bash
  vars:
    _default_agent: "{{ openclaw_agents | selectattr('is_default', 'equalto', true) | first }}"
  when: _default_agent.sandbox_mode is defined
  register: default_sandbox_result
  changed_when: "'UPDATED' in (default_sandbox_result.stdout | default(''))"
  notify: restart openclaw-gateway

# Every agent, including main, uses an explicit list heartbeat block only when
# scheduled automation is enabled. This follows the v2026.6.6 heartbeat
# allowlist rule and removes the old default-agent special case.
- block:
    - name: Write current agents JSON to temp file
      ansible.builtin.copy:
        content: "{{ agents_current.stdout }}"
        dest: /tmp/ansible_agents_current.json
        mode: '0600'
      changed_when: false
      check_mode: false

    - name: Reconcile per-agent heartbeat targeting
      ansible.builtin.include_tasks: heartbeat.yml
      loop: "{{ openclaw_agents }}"
      loop_control:
        loop_var: _heartbeat_agent
        label: "{{ _heartbeat_agent.id }}"

    - name: Set non-default agent sandbox mode override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.sandbox.mode" 2>/dev/null | sed -E '/^\[[A-Za-z][^]]*\]/d') || CURRENT=""
        DESIRED="{{ item.sandbox_mode }}"
        if [ "$CURRENT" = "$DESIRED" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.sandbox.mode" "$DESIRED"
            echo "UPDATED: {{ item.id }} sandbox.mode → {{ item.sandbox_mode }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | selectattr('sandbox_mode', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }} → {{ item.sandbox_mode }}"
      register: sandbox_result
      changed_when: "'UPDATED' in sandbox_result.stdout"
      notify: restart openclaw-gateway

  always:
    - name: Clean up current agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_agents_current.json
        state: absent
      changed_when: false
      check_mode: false

- name: Validate OpenClaw config after agent reconciliation
  ansible.builtin.command: openclaw config validate --json
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  changed_when: false
  check_mode: false
