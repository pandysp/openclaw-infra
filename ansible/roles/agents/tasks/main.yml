---
- name: Verify installed OpenClaw heartbeat contract
  ansible.builtin.shell: |
    set -euo pipefail
    INSTALLED=$(openclaw --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
    if [ "$INSTALLED" != "{{ openclaw_version }}" ]; then
      echo "ERROR: installed OpenClaw $INSTALLED does not match IaC pin {{ openclaw_version }}" >&2
      exit 1
    fi
    openclaw config validate --help >/dev/null || {
      echo "ERROR: OpenClaw {{ openclaw_version }} lacks required config validate" >&2
      exit 1
    }
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Get existing agents
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    if RAW=$(openclaw agents list --json 2>/dev/null); then
        :
    else
        RC=$?
        echo "ERROR: openclaw agents list failed with exit $RC; raw output withheld" >&2
        exit "$RC"
    fi
    CLEAN=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
    if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$CLEAN"; then
        echo "ERROR: openclaw agents list returned invalid JSON (expected an array)" >&2
        exit 1
    fi
    printf '%s\n' "$CLEAN"
  args:
    executable: /bin/bash
  register: existing_agents
  changed_when: false
  check_mode: false

- block:
    - name: Write existing agents JSON to temp file
      ansible.builtin.copy:
        content: "{{ existing_agents.stdout }}"
        dest: /tmp/ansible_existing_agents.json
        mode: '0600'
      changed_when: false
      check_mode: false

    - name: Create non-default agents
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        set +e
        # any() answers true/false: exit 0 = exists, 1 = absent, other = error.
        # (A select() that matches nothing exits 4, not 1, on a fresh server.)
        jq -e --arg id {{ item.id | quote }} 'any(.[]; .id == $id)' /tmp/ansible_existing_agents.json > /dev/null 2>&1
        JQ_RC=$?
        set -e
        if [ "$JQ_RC" -eq 0 ]; then
            echo "Agent {{ item.id }} already exists"
        elif [ "$JQ_RC" -eq 1 ]; then
            set +e
            openclaw agents add {{ item.id | quote }} --non-interactive --workspace "/home/ubuntu/.openclaw/workspace-{{ item.id }}"
            ADD_RC=$?
            set -e
            # Restrict it before anything else can fail: config changes hot-reload, and
            # `agents add` can publish the agent and still fail afterwards.
            if jq -e --arg id {{ item.id | quote }} '.agents.entries[$id] != null' {{ openclaw_config_file | quote }} > /dev/null; then
                {{ openclaw_mcp_deny_script | quote }} --tighten {{ openclaw_config_file | quote }} {{ item.id | quote }} \
                    {{ _openclaw_mcp_denies[item.id] | to_json | quote }} {{ _openclaw_mcp_owners | to_json | quote }}
            fi
            exit "$ADD_RC"
        else
            echo "ERROR: could not query validated agents JSON for {{ item.id }} (jq exit $JQ_RC)" >&2
            exit 1
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: agent_create
      changed_when: "'already exists' not in agent_create.stdout"
      notify: restart openclaw-gateway
  always:
    - name: Clean up existing agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_existing_agents.json
        state: absent
      changed_when: false
      check_mode: false

# --- Retired agents: on the server but no longer in openclaw_agents ---
# `agents delete` moves the workspace to Trash. A running Obsidian daemon would
# sync every vanished file into the cloud vault and from there to every device,
# so the agent's sync services stop first. The system agent is written before the
# delete because deleting the current one clears it (2026-11-24, agent main).
- name: Find retired agents
  ansible.builtin.set_fact:
    _openclaw_retired_agents: >-
      {{ existing_agents.stdout | from_json | map(attribute='id')
         | reject('in', openclaw_agents | map(attribute='id') | list) | list }}

# A run without the personal openclaw.yml falls back to all.yml's single `main`
# and would delete every other agent. Only agents named for removal go.
- name: Refuse to delete agents not named in openclaw_retired_agents
  ansible.builtin.assert:
    that: _unnamed | length == 0
    fail_msg: >-
      These agents are on the server but not in openclaw_agents: {{ _unnamed | join(', ') }}.
      Nothing was changed. Add them back to openclaw_agents (is the personal
      group_vars/openclaw.yml missing?), or list them in openclaw_retired_agents
      to delete them.
  vars:
    _unnamed: "{{ _openclaw_retired_agents | reject('in', openclaw_retired_agents) | list }}"

- name: Stop the sync services of retired agents
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    for UNIT in obsidian-headless-{{ item }}.service workspace-git-sync-{{ item }}.timer workspace-git-sync-{{ item }}.service; do
        LOAD=$(systemctl --user show --property=LoadState --value "$UNIT")
        if [ "$LOAD" = not-found ]; then continue; fi
        if [ "$LOAD" != loaded ]; then echo "ERROR: $UNIT has load state '$LOAD'" >&2; exit 1; fi
        ACTIVE=$(systemctl --user is-active "$UNIT" || true)
        ENABLED=$(systemctl --user is-enabled "$UNIT" || true)
        if [ "$ENABLED" = enabled ] || [ "$ACTIVE" = active ] || [ "$ACTIVE" = activating ]; then
            {% if ansible_check_mode %}
            echo "UPDATED: would stop and disable $UNIT"
            continue
            {% else %}
            systemctl --user stop "$UNIT"
            if [ "$ENABLED" = enabled ]; then systemctl --user disable "$UNIT"; fi
            echo "UPDATED: stopped and disabled $UNIT"
            {% endif %}
        fi
        ACTIVE=$(systemctl --user is-active "$UNIT" || true)
        case "$ACTIVE" in
            inactive|failed) ;;
            *) echo "ERROR: $UNIT is still $ACTIVE; refusing to delete agent {{ item }}" >&2; exit 1 ;;
        esac
    done
  args:
    executable: /bin/bash
  loop: "{{ _openclaw_retired_agents }}"
  register: retired_units
  changed_when: "'UPDATED' in retired_units.stdout"
  check_mode: false

- name: Set the system agent
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    CURRENT=$(openclaw config get agents.defaults.systemAgent.agentId 2>&1 | sed -E '/^\[[A-Za-z][^]]*\]/d') || {
        if echo "$CURRENT" | grep -qE '^Config path is valid but unset:'; then
            CURRENT=""
        else
            echo "ERROR: could not read agents.defaults.systemAgent.agentId" >&2
            exit 1
        fi
    }
    if [ "$CURRENT" = {{ openclaw_system_agent | quote }} ]; then
        echo "OK"
    else
        {% if not ansible_check_mode %}
        openclaw config set agents.defaults.systemAgent.agentId {{ openclaw_system_agent | quote }}
        {% endif %}
        echo "UPDATED: system agent ${CURRENT:-(none)} → {{ openclaw_system_agent }}"
    fi
  args:
    executable: /bin/bash
  register: system_agent_result
  changed_when: "'UPDATED' in system_agent_result.stdout"
  check_mode: false

- name: Delete retired agents
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    {% if ansible_check_mode %}
    echo "UPDATED: would delete agent {{ item }} (its workspace moves to Trash)"
    {% else %}
    RAW=$(openclaw agents delete {{ item | quote }} --force --json)
    RESULT=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
    if ! jq -e '.purgeFailed != true and ((.failed // []) | length == 0)' >/dev/null <<< "$RESULT"; then
        echo "ERROR: agent {{ item }} left files or session data behind:" >&2
        printf '%s\n' "$RESULT" >&2
        exit 1
    fi
    echo "UPDATED: deleted agent {{ item }}"
    printf '%s\n' "$RESULT"
    {% endif %}
  args:
    executable: /bin/bash
  loop: "{{ _openclaw_retired_agents }}"
  register: retired_delete
  changed_when: "'UPDATED' in retired_delete.stdout"
  check_mode: false

- name: Show retired agent and system agent changes
  ansible.builtin.debug:
    msg: >-
      {{ (retired_units.results | map(attribute='stdout_lines') | flatten)
         + system_agent_result.stdout_lines
         + (retired_delete.results | map(attribute='stdout_lines') | flatten)
         | select('match', 'UPDATED') | list }}
  when: retired_units is changed or system_agent_result is changed or retired_delete is changed

- name: Refresh agent list for config targeting
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    if RAW=$(openclaw agents list --json 2>/dev/null); then
        :
    else
        RC=$?
        echo "ERROR: openclaw agents list failed with exit $RC; raw output withheld" >&2
        exit "$RC"
    fi
    CLEAN=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
    if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$CLEAN"; then
        echo "ERROR: openclaw agents list returned invalid JSON (expected an array)" >&2
        exit 1
    fi
    printf '%s\n' "$CLEAN"
  args:
    executable: /bin/bash
  register: agents_current
  changed_when: false
  check_mode: false

# --- Per-agent MCP tool scoping (sole writer; the plugins role only checks) ---
# Runs after agents exist and before any later role restarts the gateway. New
# agents get theirs in the creation task itself, so a later creation failing
# cannot leave an earlier new agent unrestricted.
- name: Set per-agent tool deny rules for MCP tools
  ansible.builtin.command:
    argv:
      - "{{ openclaw_mcp_deny_script }}"
      - --tighten
      - "{{ openclaw_config_file }}"
      - "{{ item.id }}"
      - "{{ _openclaw_mcp_denies[item.id] | to_json }}"
      - "{{ _openclaw_mcp_owners | to_json }}"
  loop: "{{ openclaw_agents }}"
  loop_control:
    label: "{{ item.id }}"
  register: deny_result
  changed_when: "'UPDATED' in deny_result.stdout"
  notify: restart openclaw-gateway

# The agents role is the only heartbeat writer. A safe 0m global default means
# omission can never opt an agent into OpenClaw's upstream 30m default.
- name: Set safe global heartbeat defaults
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    DESIRED='{{ _heartbeat_defaults | to_json }}'
    CURRENT=$(openclaw config get "agents.defaults.heartbeat" 2>&1 | sed -E '/^\[[A-Za-z][^]]*\]/d') || {
        if echo "$CURRENT" | grep -qE '^Config path is valid but unset:'; then
            CURRENT="{}"
        else
            echo "ERROR: could not read agents.defaults.heartbeat" >&2
            exit 1
        fi
    }
    if ! D_NORM=$(echo "$DESIRED" | jq -e -cS 'select(type == "object")'); then
        echo "ERROR: generated agents.defaults.heartbeat is not a JSON object" >&2
        exit 1
    fi
    if ! C_NORM=$(echo "$CURRENT" | jq -e -cS 'select(type == "object")' 2>/dev/null); then
        echo "ERROR: existing agents.defaults.heartbeat is unreadable; refusing to overwrite it" >&2
        exit 1
    fi
    if [ "$C_NORM" = "$D_NORM" ]; then
        echo "OK"
    else
        {% if not ansible_check_mode %}
        openclaw config set "agents.defaults.heartbeat" --json "$DESIRED"
        {% endif %}
        echo "UPDATED: safe global heartbeat defaults"
    fi
  args:
    executable: /bin/bash
  vars:
    _heartbeat_defaults: >-
      {{ {'every': '0m', 'model': openclaw_heartbeat_model, 'directPolicy': 'allow'}
         | combine({'activeHours': openclaw_heartbeat_active_hours}
           if openclaw_heartbeat_active_hours is defined and openclaw_heartbeat_active_hours else {}) }}
  register: heartbeat_defaults_result
  changed_when: "'UPDATED' in (heartbeat_defaults_result.stdout | default(''))"
  check_mode: false
  notify: restart openclaw-gateway

- name: Set default agent sandbox mode
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    CURRENT=$(openclaw config get "agents.defaults.sandbox.mode" 2>/dev/null | sed -E '/^\[[A-Za-z][^]]*\]/d') || CURRENT=""
    DESIRED="{{ _default_agent.sandbox_mode }}"
    if [ "$CURRENT" = "$DESIRED" ]; then
        echo "OK"
    else
        openclaw config set "agents.defaults.sandbox.mode" "$DESIRED"
        echo "UPDATED: default agent sandbox.mode → {{ _default_agent.sandbox_mode }}"
    fi
  args:
    executable: /bin/bash
  vars:
    _default_agent: "{{ openclaw_agents | selectattr('is_default', 'equalto', true) | first }}"
  when:
    - _openclaw_has_owner
    - _default_agent.sandbox_mode is defined
  register: default_sandbox_result
  changed_when: "'UPDATED' in (default_sandbox_result.stdout | default(''))"
  notify: restart openclaw-gateway

# Every agent, including main, uses an explicit agents.entries heartbeat block
# only when scheduled automation is enabled. This follows the heartbeat allowlist rule
# of openclaw_docs_reviewed_version and removes the old default-agent special
# case.
- block:
    - name: Write current agents JSON to temp file
      ansible.builtin.copy:
        content: "{{ agents_current.stdout }}"
        dest: /tmp/ansible_agents_current.json
        mode: '0600'
      changed_when: false
      check_mode: false

    - name: Reconcile per-agent heartbeat targeting
      ansible.builtin.include_tasks: heartbeat.yml
      loop: "{{ openclaw_agents }}"
      loop_control:
        loop_var: _heartbeat_agent
        label: "{{ _heartbeat_agent.id }}"

    - name: Set non-default agent sandbox mode override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        jq -e --arg id {{ item.id | quote }} 'any(.[]; .id == $id)' /tmp/ansible_agents_current.json >/dev/null || {
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        }
        CURRENT=$(openclaw config get "agents.entries.{{ item.id }}.sandbox.mode" 2>/dev/null | sed -E '/^\[[A-Za-z][^]]*\]/d') || CURRENT=""
        DESIRED="{{ item.sandbox_mode }}"
        if [ "$CURRENT" = "$DESIRED" ]; then
            echo "OK"
        else
            openclaw config set "agents.entries.{{ item.id }}.sandbox.mode" "$DESIRED"
            echo "UPDATED: {{ item.id }} sandbox.mode → {{ item.sandbox_mode }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | selectattr('sandbox_mode', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }} → {{ item.sandbox_mode }}"
      register: sandbox_result
      changed_when: "'UPDATED' in sandbox_result.stdout"
      notify: restart openclaw-gateway

  always:
    - name: Clean up current agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_agents_current.json
        state: absent
      changed_when: false
      check_mode: false

- name: Validate OpenClaw config after agent reconciliation
  ansible.builtin.command: openclaw config validate --json
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  changed_when: false
  check_mode: false
