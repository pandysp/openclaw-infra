---
- name: Check if base sandbox image exists
  ansible.builtin.command: docker image inspect openclaw-sandbox:trixie
  register: base_image_check
  changed_when: false
  failed_when: false

- name: Check the base sandbox image's CA package
  ansible.builtin.include_role:
    name: docker
    tasks_from: image-ca-floor.yml
  vars:
    image_ca_floor_image: openclaw-sandbox:trixie

- name: Remember the base image's CA state
  ansible.builtin.set_fact:
    _sandbox_base_ca: "{{ image_ca_floor }}"

# Checked on its own too: a run that rebuilt the base and then failed in the custom
# build leaves a current base under a stale custom image, with no Dockerfile change
# left to trigger the custom build on retry.
- name: Check the custom sandbox image's CA package
  ansible.builtin.include_role:
    name: docker
    tasks_from: image-ca-floor.yml
  vars:
    image_ca_floor_image: openclaw-sandbox-custom:latest

- name: Remember the custom image's CA state
  ansible.builtin.set_fact:
    _sandbox_custom_ca: "{{ image_ca_floor }}"

- name: Read uv in the existing custom sandbox image
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, none, --entrypoint, uv, openclaw-sandbox-custom:latest, --version]
  register: sandbox_uv_before
  changed_when: false
  failed_when: false
  check_mode: false
  when: _sandbox_custom_ca != 'missing'

# A forced or stale rebuild starts from a freshly pulled Debian and fresh apt
# packages, so no cached layer can carry old trust roots into the new images.
- name: Decide whether the sandbox images are rebuilt from scratch
  ansible.builtin.set_fact:
    _sandbox_base_fresh: "{{ _base_fresh | bool }}"
    _sandbox_custom_fresh: >-
      {{ _base_fresh | bool or _sandbox_custom_ca == 'stale'
         or (_sandbox_custom_ca != 'missing'
             and not (sandbox_uv_before.rc == 0 and sandbox_uv_before.stdout.startswith('uv ' ~ uv_version ~ ' '))) }}
  vars:
    _base_fresh: "{{ force_sandbox_rebuild | bool or _sandbox_base_ca == 'stale' }}"

- name: Create sandbox build directory
  ansible.builtin.file:
    path: /home/ubuntu/.openclaw/sandbox-build
    state: directory
    mode: "0755"

- name: Template base sandbox Dockerfile
  ansible.builtin.template:
    src: Dockerfile.base.j2
    dest: /home/ubuntu/.openclaw/sandbox-build/Dockerfile.base
    mode: "0644"
  register: base_dockerfile_changed

- name: Build base sandbox image
  ansible.builtin.shell: |
    docker build {{ '--pull --no-cache' if _sandbox_base_fresh | bool else '' }} -t openclaw-sandbox:trixie -f /home/ubuntu/.openclaw/sandbox-build/Dockerfile.base /home/ubuntu/.openclaw/sandbox-build/
  args:
    executable: /bin/bash
  when: base_image_check.rc != 0 or base_dockerfile_changed.changed or _sandbox_base_fresh | bool
  register: base_image_build

- name: Verify the base sandbox image meets the CA floor
  ansible.builtin.include_role:
    name: docker
    tasks_from: image-ca-floor.yml
  vars:
    image_ca_floor_image: openclaw-sandbox:trixie
    image_ca_floor_require: true

- name: Template custom sandbox Dockerfile
  ansible.builtin.template:
    src: Dockerfile.sandbox.j2
    dest: /home/ubuntu/.openclaw/sandbox-build/Dockerfile
    mode: "0644"
  register: dockerfile_changed

- name: Check if custom sandbox image exists
  ansible.builtin.command: docker image inspect openclaw-sandbox-custom:latest
  register: custom_image_check
  changed_when: false
  failed_when: false

# `--pull` would look for the local base image in a registry, so the custom build
# refreshes its one pinned external stage explicitly instead.
- name: Pull the pinned uv image for a fresh build
  ansible.builtin.command: docker pull --quiet ghcr.io/astral-sh/uv:{{ uv_version }}
  when: _sandbox_custom_fresh | bool
  changed_when: false

- name: Build custom sandbox Docker image
  ansible.builtin.shell: |
    docker build {{ '--no-cache' if _sandbox_custom_fresh | bool else '' }} -t openclaw-sandbox-custom:latest /home/ubuntu/.openclaw/sandbox-build/
  args:
    executable: /bin/bash
  when: >-
    _sandbox_custom_fresh | bool or dockerfile_changed.changed or base_image_build is changed
    or custom_image_check.rc != 0
  register: custom_image_build

- name: Verify the custom sandbox image meets the CA floor
  ansible.builtin.include_role:
    name: docker
    tasks_from: image-ca-floor.yml
  vars:
    image_ca_floor_image: openclaw-sandbox-custom:latest
    image_ca_floor_require: true

- name: Verify the custom sandbox image carries uv {{ uv_version }}
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, none, --entrypoint, uv, openclaw-sandbox-custom:latest, --version]
  register: sandbox_uv_version
  changed_when: false
  failed_when: sandbox_uv_version.rc != 0 or not sandbox_uv_version.stdout.startswith('uv ' ~ uv_version ~ ' ')
  when: not ansible_check_mode

# The withdrawn 2026.10.8 pin (#65) copied the Mac private key here for OpenClaw sandboxes.
- name: Remove the sandbox Mac key copies of the 2026.10 pin
  ansible.builtin.file:
    path: /home/ubuntu/.openclaw/sandbox-ssh
    state: absent

# Running sandboxes keep the image and settings they were created with. Remove them
# when either changed; OpenClaw creates fresh ones from the current config on next use.
- name: Fingerprint the sandbox image and settings
  ansible.builtin.shell: |
    set -euo pipefail
    {
        docker image inspect --format '{{ '{{' }}.Id{{ '}}' }}' openclaw-sandbox-custom:latest
        jq -cS '{defaults: .agents.defaults.sandbox, agents: (.agents.entries // {} | map_values(.sandbox))}' /home/ubuntu/.openclaw/openclaw.json
    } | sha256sum | cut -d' ' -f1
  args:
    executable: /bin/bash
  register: sandbox_fingerprint
  changed_when: false
  check_mode: false

- name: Read the fingerprint of the running sandboxes
  ansible.builtin.slurp:
    src: /home/ubuntu/.openclaw/.ansible-hashes/sandbox-runtime
  register: sandbox_running_fingerprint
  failed_when: false
  check_mode: false

- name: Recreate sandboxes with the current image and settings
  when: >-
    custom_image_build is changed
    or (sandbox_running_fingerprint.content | default('') | b64decode | trim) != sandbox_fingerprint.stdout
  block:
    - name: Remove sandbox containers
      ansible.builtin.shell: |
        set -euo pipefail
        containers=$(docker ps -aq --filter "name=openclaw-sbx-")
        if [ -n "$containers" ]; then
          echo "$containers" | xargs docker rm -f
        fi
      args:
        executable: /bin/bash
      register: container_removal
      changed_when: container_removal.stdout | length > 0

    - name: Verify no sandbox containers remain
      ansible.builtin.shell: |
        set -euo pipefail
        count=$(docker ps -aq --filter "name=openclaw-sbx-" | wc -l)
        if [ "$count" -ne 0 ]; then
          echo "ERROR: $count sandbox containers remain after removal"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create the provisioning hash folder
      ansible.builtin.file:
        path: /home/ubuntu/.openclaw/.ansible-hashes
        state: directory
        mode: "0700"

    - name: Record the fingerprint of the sandboxes to come
      ansible.builtin.copy:
        content: "{{ sandbox_fingerprint.stdout }}\n"
        dest: /home/ubuntu/.openclaw/.ansible-hashes/sandbox-runtime
        mode: "0600"
