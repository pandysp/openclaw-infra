---
- name: Determine whether the current backend uses C assets
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        from pathlib import Path
        path = Path.home() / '.openclaw/openclaw.json'
        # First provisioning has no backend yet; malformed existing JSON fails.
        config = json.loads(path.read_text()) if path.exists() else {}
        command = config.get('agents', {}).get('defaults', {}).get('cliBackends', {}).get('claude-cli', {}).get('command')
        print('yes' if command == sys.argv[1] else 'no')
      - "{{ openclaw_claude_cli_command }}"
  register: claude_cli_backend_in_use
  changed_when: false
