---
- name: Provide configured credentials to native skill scripts
  ansible.builtin.include_tasks: skill-environment.yml

- name: Install the configured web provider plugins
  ansible.builtin.include_tasks: web-plugin.yml
  loop: >-
    {{ (['exa'] if exa_api_key | default('') | length > 0 else []) +
       (['firecrawl'] if openclaw_firecrawl_enabled | bool else []) }}
  loop_control:
    loop_var: web_plugin

- name: Apply managed gateway configuration
  ansible.builtin.include_tasks: gateway-config.yml

- name: Check daemon service file token matches gateway.auth.token
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    SERVICE_FILE="/home/ubuntu/.config/systemd/user/openclaw-gateway.service"
    [ -f "$SERVICE_FILE" ] || { echo "SKIP: no service file"; exit 0; }

    # Older service files can retain a token that overrides the config.
    SERVICE_TOKEN=$(grep -oP 'OPENCLAW_GATEWAY_TOKEN=\K[^\s"]+' "$SERVICE_FILE") || {
        rc=$?
        [ "$rc" -eq 1 ] || exit "$rc"
        SERVICE_TOKEN=""
    }
    [ -n "$SERVICE_TOKEN" ] || { echo "SKIP: no token in service file"; exit 0; }
    CONFIG_TOKEN=$(jq -r '.gateway.auth.token // empty' /home/ubuntu/.openclaw/openclaw.json)
    [ -n "$CONFIG_TOKEN" ] || { echo "ERROR: configured gateway token is missing"; exit 1; }
    if [ "$SERVICE_TOKEN" != "$CONFIG_TOKEN" ]; then
        openclaw daemon install --force
        systemctl --user daemon-reload
        echo "REGENERATED: service file token updated to match gateway.auth.token"
    else
        echo "OK"
    fi
  args:
    executable: /bin/bash
  no_log: true
  register: daemon_token_sync
  changed_when: "'REGENERATED' in daemon_token_sync.stdout"
  notify: restart openclaw-gateway

# Workaround for openclaw/openclaw#54555: xAI's web search credential reader
# misses plugin config. The environment also supplies independent X search.
- name: Ensure gateway service drop-in directory exists
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d
    state: directory
    mode: "0755"

- name: Set XAI_API_KEY env var in gateway service (openclaw#54555 workaround)
  ansible.builtin.copy:
    dest: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/xai-api-key.conf
    content: |
      [Service]
      Environment=XAI_API_KEY={{ xai_api_key }}
    mode: "0600"
  no_log: true
  when: xai_api_key is defined and xai_api_key | length > 0
  register: xai_dropin

- name: Remove XAI_API_KEY drop-in when key is absent
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/xai-api-key.conf
    state: absent
  when: not (xai_api_key is defined and xai_api_key | length > 0)
  register: xai_dropin_absent

- name: Reload systemd after drop-in change
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/1000"
  when: (xai_dropin is defined and xai_dropin.changed) or (xai_dropin_absent is defined and xai_dropin_absent.changed)
  notify: restart openclaw-gateway

- name: Enforce agent auth-profiles — setup token present, api-key profile absent
  ansible.builtin.shell: |
    set -euo pipefail
    python3 << 'PYEOF'
    import json, os
    from pathlib import Path

    openclaw_dir = Path(os.path.expanduser("~/.openclaw"))
    token = os.environ["CLAUDE_SETUP_TOKEN"].strip()

    if not token:
        print("SKIP: no claude_setup_token")
        raise SystemExit(0)

    changed_agents = []

    for agent_dir in sorted((openclaw_dir / "agents").iterdir()):
        profiles_path = agent_dir / "agent" / "auth-profiles.json"
        if not profiles_path.exists():
            continue

        content = profiles_path.read_text().strip()
        data = json.loads(content) if content else {}
        profiles = data.get("profiles", {})
        original_profiles = dict(profiles)

        # Ensure setup token profile exists with the expected value.
        desired_default = {"type": "token", "provider": "anthropic", "token": token}
        if profiles.get("anthropic:default") != desired_default:
            profiles["anthropic:default"] = desired_default
        profiles.pop("anthropic:api-key", None)

        if profiles != original_profiles or not content:
            data["version"] = 1
            data["profiles"] = profiles
            if "lastGood" not in data:
                data["lastGood"] = {"anthropic": "anthropic:default"}
            profiles_path.write_text(json.dumps(data, indent=2) + "\n")
            profiles_path.chmod(0o600)
            changed_agents.append(agent_dir.name)

    if changed_agents:
        print("CHANGED: " + ", ".join(changed_agents))
    else:
        print("OK")
    PYEOF
  args:
    executable: /bin/bash
  environment:
    CLAUDE_SETUP_TOKEN: "{{ claude_setup_token | default('') }}"
  no_log: true
  register: auth_profiles_result
  changed_when: "'CHANGED:' in auth_profiles_result.stdout"
  notify: restart openclaw-gateway

- name: Migrate session model provider to match primary model
  ansible.builtin.shell: |
    set -euo pipefail
    python3 << 'PYEOF'
    import glob, json, os, subprocess, sys, tempfile

    # Extract provider prefix from the primary model (e.g., "anthropic" from "anthropic/claude-opus-4-6")
    primary = "{{ openclaw_model_primary }}"
    if "/" not in primary:
        raise ValueError(f"openclaw_model_primary must be provider/model format, got: {primary}")
    target_provider, target_model = primary.split("/", 1)
    # Sessions record the runtime that ran them: with agentRuntime claude-cli the
    # turns of the primary model are stored as provider "claude-cli", not a foreign one.
    accepted_providers = set(filter(None, [target_provider, "{{ openclaw_agent_models[openclaw_model_primary].agentRuntime.id | default('') }}"]))

    def foreign(entry):
        provider = entry.get("modelProvider", "") if isinstance(entry, dict) else ""
        return bool(provider) and provider not in accepted_providers

    def load(path):
        try:
            with open(path) as f:
                return json.load(f)
        except json.JSONDecodeError as error:
            sys.exit(f"Unreadable session store {path}: {error}")

    stores = sorted(glob.glob("/home/ubuntu/.openclaw/agents/*/sessions/sessions.json"))
    pending = [path for path in stores if any(foreign(entry) for entry in load(path).values())]
    if not pending:
        print("OK")
        sys.exit(0)

    # Session-file migration also needs the gateway stopped: it keeps these
    # legacy stores in memory and rewrites them whole.
    systemctl = ["systemctl", "--user"]
    subprocess.run(systemctl + ["stop", "openclaw-gateway"], check=True)
    migrated = []
    try:
        for path in pending:
            data = load(path)
            old_providers = sorted({entry["modelProvider"] for entry in data.values() if foreign(entry)})
            for entry in data.values():
                if foreign(entry):
                    entry["modelProvider"] = target_provider
                    entry["model"] = target_model
            fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path), prefix=".sessions-migrate-")
            with os.fdopen(fd, "w") as f:
                json.dump(data, f, indent=2)
            os.chmod(tmp, os.stat(path).st_mode & 0o777)
            os.replace(tmp, path)
            agent = path.split("/agents/")[1].split("/")[0]
            migrated.append(agent + " (" + ", ".join(old_providers) + ")")
    finally:
        subprocess.run(systemctl + ["start", "openclaw-gateway"], check=True)

    # Agent and old provider names only (never session content).
    print("MIGRATED: " + "; ".join(migrated))
    PYEOF
  args:
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/1000"
  register: session_migration_result
  changed_when: "'MIGRATED:' in session_migration_result.stdout"

- name: Show which sessions were moved to the primary model
  ansible.builtin.debug:
    msg: "{{ session_migration_result.stdout_lines | select('match', '^MIGRATED:') | list }}"
  when: session_migration_result is changed
