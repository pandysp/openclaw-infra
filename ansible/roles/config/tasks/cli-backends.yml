---
# Shared by normal configuration and C activation after its assets are ready.
- name: Configure the requested CLI backends
  block:
    # A per-run file: concurrent provisioners must never apply or remove
    # each other's request.
    - name: Allocate private CLI backend configuration batch
      ansible.builtin.tempfile:
        state: file
        prefix: ansible-cli-backends-
        suffix: .json
      register: _cli_backends_batch
      changed_when: false

    - name: Write private CLI backend configuration batch
      ansible.builtin.copy:
        content: "{{ [{'path': 'agents.defaults.cliBackends', 'value': _desired_cli_backends}] | to_json }}"
        dest: "{{ _cli_backends_batch.path }}"
        mode: "0600"
      no_log: true
      changed_when: false

    - name: Apply CLI backend configuration only when changed
      ansible.builtin.shell: |
        set -euo pipefail
        python3 <<'PY'
        import json, os
        from pathlib import Path
        import subprocess

        batch = Path(os.environ['CLI_BACKENDS_BATCH'])
        wanted = json.loads(batch.read_text())[0]['value']
        config = json.loads((Path.home() / '.openclaw/openclaw.json').read_text())
        current = config.get('agents', {}).get('defaults', {}).get('cliBackends')
        managed = os.environ['OPENCLAW_CLAUDE_CONTAINER_COMMAND']
        current_cli = (current or {}).get('claude-cli', {})
        wanted_cli = wanted.get('claude-cli', {})
        # Normal configuration must not temporarily undo an already-active C
        # backend. An explicitly configured replacement command still wins.
        if current_cli.get('command') == managed and 'command' not in wanted_cli:
            wanted['claude-cli'] = {**wanted_cli, 'command': managed}
            batch.write_text(json.dumps([{'path': 'agents.defaults.cliBackends', 'value': wanted}]))
        if current == wanted:
            print('OK')
        else:
            subprocess.run(['openclaw', 'config', 'set', '--batch-file', str(batch)],
                           check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
            print('UPDATED: agents.defaults.cliBackends')
        PY
      args:
        executable: /bin/bash
      environment:
        CLI_BACKENDS_BATCH: "{{ _cli_backends_batch.path }}"
        OPENCLAW_CLAUDE_CONTAINER_COMMAND: "{{ openclaw_claude_cli_command }}"
      no_log: true
      register: cli_backends_result
      changed_when: "'UPDATED:' in cli_backends_result.stdout"
      notify: restart openclaw-gateway
  rescue:
    - name: Report CLI backend configuration failure
      ansible.builtin.fail:
        msg: CLI backend configuration failed. Check config schema and file permissions; private diagnostics are withheld.
  always:
    - name: Remove private CLI backend configuration batch
      ansible.builtin.file:
        path: "{{ _cli_backends_batch.path }}"
        state: absent
      when: _cli_backends_batch.path is defined
      changed_when: false
