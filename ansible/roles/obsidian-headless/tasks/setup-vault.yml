---
# Per-workspace Obsidian Sync setup (included from main.yml loop).
# Creating + linking the remote vault is first-time-only (gated on the vault not
# yet being linked). Sync config is enforced on EVERY run so config changes
# (e.g. enabling community-plugin sync) propagate to already-linked vaults — the
# daemon is restarted when the effective config actually changes so it re-reads it.
#
# Receives `item` from the loop with keys: agent_id, workspace_dir

- name: "Check if {{ item.agent_id }} workspace is already linked"
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH=$HOME/.npm-global/bin:$PATH
    export OBSIDIAN_AUTH_TOKEN="{{ obsidian_auth_token }}"
    ob sync-status --path "{{ item.workspace_dir }}" 2>&1
  args:
    executable: /bin/bash
  register: sync_status
  changed_when: false
  # rc=0: linked, rc=3: not linked. Fail on rc=1 (general error) or rc=2 (auth failure).
  failed_when: sync_status.rc not in [0, 3]
  no_log: true

# First-time link only: create the remote vault and link this workspace to it.
- name: "Link {{ item.agent_id }} workspace to Obsidian Sync (first-time)"
  when: sync_status.rc == 3
  environment:
    PATH: "/home/ubuntu/.npm-global/bin:/usr/local/bin:/usr/bin:/bin"
    OBSIDIAN_AUTH_TOKEN: "{{ obsidian_auth_token }}"
  block:
    - name: "Check if remote vault already exists for {{ item.agent_id }}"
      ansible.builtin.shell: |
        set -euo pipefail
        ob sync-list-remote 2>&1 | grep -q "{{ item.agent_id }}-workspace"
      args:
        executable: /bin/bash
      register: vault_exists
      changed_when: false
      failed_when: false

    - name: "Create remote vault for {{ item.agent_id }}"
      ansible.builtin.shell: |
        set -euo pipefail
        ob sync-create-remote \
          --name "{{ item.agent_id }}-workspace" \
          --encryption e2ee \
          --password "$(cat /home/ubuntu/.openclaw/obsidian-vault-password)"
      args:
        executable: /bin/bash
      no_log: true
      when: vault_exists.rc != 0

    - name: "Get vault ID for {{ item.agent_id }}"
      ansible.builtin.shell: |
        set -euo pipefail
        ob sync-list-remote 2>&1 | grep "{{ item.agent_id }}-workspace" | awk '{print $1}'
      args:
        executable: /bin/bash
      register: vault_id
      failed_when: vault_id.stdout | length == 0

    - name: "Link vault to {{ item.agent_id }} workspace"
      ansible.builtin.shell: |
        set -euo pipefail
        ob sync-setup \
          --vault "{{ vault_id.stdout | trim }}" \
          --path "{{ item.workspace_dir }}" \
          --password "$(cat /home/ubuntu/.openclaw/obsidian-vault-password)" \
          --device-name "openclaw-vps-{{ item.agent_id }}"
      args:
        executable: /bin/bash
      no_log: true

# Every run: enforce sync config (exclusions + config categories) so changes
# reach already-linked vaults. sync-config/sync-status are local-only (no auth
# token, so errors stay visible). Restart the daemon only when the effective
# config actually changes, so it re-reads it.
- name: "Enforce Obsidian Sync config for {{ item.agent_id }}"
  ansible.builtin.shell: |
    set -euo pipefail
    before=$(ob sync-status --path "{{ item.workspace_dir }}" 2>/dev/null | grep -iE 'Configs:' || true)
    ob sync-config --path "{{ item.workspace_dir }}" \
      --excluded-folders "{{ obsidian_headless_excluded_folders }}" \
      --configs "{{ obsidian_headless_configs }}" >/dev/null
    after=$(ob sync-status --path "{{ item.workspace_dir }}" 2>/dev/null | grep -iE 'Configs:' || true)
    [ "$before" = "$after" ] && echo "config:same" || echo "config:changed"
  args:
    executable: /bin/bash
  environment:
    PATH: "/home/ubuntu/.npm-global/bin:/usr/local/bin:/usr/bin:/bin"
  register: obsidian_sync_config
  changed_when: "'config:changed' in obsidian_sync_config.stdout"
  notify: enable obsidian-headless services

# First-time link only: a blocking initial sync so the vault is populated
# before the continuous daemon starts.
- name: "Initial sync (first-time) for {{ item.agent_id }}"
  when: sync_status.rc == 3
  environment:
    PATH: "/home/ubuntu/.npm-global/bin:/usr/local/bin:/usr/bin:/bin"
    OBSIDIAN_AUTH_TOKEN: "{{ obsidian_auth_token }}"
  block:
    - name: "Run initial sync for {{ item.agent_id }}"
      ansible.builtin.shell: |
        set -euo pipefail
        timeout {{ obsidian_headless_initial_sync_timeout }} \
          ob sync --path "{{ item.workspace_dir }}"
      args:
        executable: /bin/bash
      register: initial_sync
      # rc=0: sync completed naturally before timeout
      # rc=124: timeout killed the process (sync was still in progress — incomplete)
      failed_when: initial_sync.rc not in [0, 124]

    - name: "Warn if initial sync was incomplete for {{ item.agent_id }}"
      ansible.builtin.debug:
        msg: >-
          Initial sync for {{ item.agent_id }} was killed by timeout after
          {{ obsidian_headless_initial_sync_timeout }}s (rc=124). The daemon
          will continue syncing in the background.
      when: initial_sync.rc == 124
