---
- name: Flush handlers (ensure gateway is restarted before cron operations)
  ansible.builtin.meta: flush_handlers

- name: Verify installed OpenClaw cron contract
  ansible.builtin.shell: |
    set -euo pipefail
    INSTALLED=$(openclaw --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
    if [ "$INSTALLED" != "{{ openclaw_version }}" ]; then
      echo "ERROR: installed OpenClaw $INSTALLED does not match IaC pin {{ openclaw_version }}" >&2
      exit 1
    fi
    openclaw cron list --help | grep -q -- '--all' || {
      echo "ERROR: OpenClaw {{ openclaw_version }} cron list lacks required --all" >&2
      exit 1
    }
    openclaw cron add --help | grep -q -- '--disabled' || {
      echo "ERROR: OpenClaw {{ openclaw_version }} cron add lacks required --disabled" >&2
      exit 1
    }
    EDIT_HELP=$(openclaw cron edit --help)
    grep -q -- '--enable' <<< "$EDIT_HELP" || {
      echo "ERROR: OpenClaw {{ openclaw_version }} cron edit lacks required --enable" >&2
      exit 1
    }
    grep -q -- '--disable' <<< "$EDIT_HELP" || {
      echo "ERROR: OpenClaw {{ openclaw_version }} cron edit lacks required --disable" >&2
      exit 1
    }
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Wait for gateway and establish cli operator.admin (silent first-contact)
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    OPENCLAW_GATEWAY_TOKEN=$(python3 -c "import json; print(json.load(open('/home/ubuntu/.openclaw/openclaw.json'))['gateway']['auth']['token'])")
    [[ -n "$OPENCLAW_GATEWAY_TOKEN" ]] || { echo 'ERROR: gateway token is empty' >&2; exit 1; }
    export OPENCLAW_GATEWAY_TOKEN
    PROBE="00000000-0000-0000-0000-000000000000"

    # HTTP health does not open a gateway WS session or pair the cli device.
    for i in $(seq 1 12); do
        if openclaw health >/dev/null 2>&1; then break; fi
        sleep 5
    done

    # Make the first gateway WS operation an operator.admin write. A bogus cron
    # remove changes no state and gives a fresh loopback cli the scopes cron
    # reconciliation needs. An earlier read would pair it below admin.
    BLOCKED="scope upgrade|pairing required|more scopes|not approved|not paired"
    CONNECTING="refused|econnrefused|not ready|unavailable|closed|timed out|timeout|connect"
    OUT=""
    RC=0
    for i in $(seq 1 24); do
        set +e
        OUT=$(openclaw cron remove "$PROBE" 2>&1)
        RC=$?
        set -e
        if [ "$RC" -eq 0 ] || printf '%s' "$OUT" | grep -qiF 'invalid cron.remove params: id not found'; then
            echo "Gateway ready; cli holds operator.admin via silent first-contact grant"
            exit 0
        fi
        if printf '%s' "$OUT" | grep -qiE "$BLOCKED|$CONNECTING"; then
            sleep 10
            continue
        fi
        echo "ERROR: unexpected cron probe failure (exit $RC); private diagnostics withheld" >&2
        exit 1
    done
    echo "ERROR: gateway did not become ready or cli lacks operator.admin" >&2
    echo "Re-run after resolving gateway health or pairing: ./scripts/provision.sh --tags telegram" >&2
    exit 1
  args:
    executable: /bin/bash
  register: gateway_health
  changed_when: false
  failed_when: gateway_health.rc != 0
  check_mode: false

- name: Read gateway token for cron operations
  ansible.builtin.shell: |
    python3 -c "import json; print(json.load(open('/home/ubuntu/.openclaw/openclaw.json'))['gateway']['auth']['token'])"
  args:
    executable: /bin/bash
  register: _gw_token
  changed_when: false
  no_log: true
  failed_when: false
  check_mode: false

- name: Fail closed when gateway token cannot be read
  ansible.builtin.fail:
    msg: >-
      Could not read a non-empty gateway token for cron reconciliation
      (exit {{ _gw_token.rc }}). The cron state was not changed.
  when: _gw_token.rc != 0 or _gw_token.stdout | trim | length == 0

- name: Build agent delivery maps
  ansible.builtin.set_fact:
    agent_deliver_map: >-
      {{ dict(openclaw_agents | map(attribute='id') | zip(openclaw_agents | map(attribute='deliver_to'))) }}
    agent_channel_map: >-
      {{ dict(openclaw_agents | map(attribute='id') | zip(openclaw_agents | map(attribute='deliver_channel', default='telegram'))) }}

- name: Initialize managed cron jobs
  ansible.builtin.set_fact:
    managed_cron_jobs: []

- name: Select cron jobs with usable delivery or explicit absent state
  ansible.builtin.set_fact:
    managed_cron_jobs: "{{ managed_cron_jobs + [item] }}"
  loop: "{{ openclaw_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (item.state | default('present')) == 'absent' or
    (agent_deliver_map[item.agent] | default('') | string | length > 0)

- name: Show skipped cron jobs (agents without delivery targets)
  ansible.builtin.debug:
    msg: "Skipping {{ item.name }} — agent '{{ item.agent }}' has no delivery target"
  loop: "{{ openclaw_cron_jobs | difference(managed_cron_jobs) }}"
  loop_control:
    label: "{{ item.name }}"
  when: (openclaw_cron_jobs | difference(managed_cron_jobs)) | length > 0

- name: Initialize managed present cron names
  ansible.builtin.set_fact:
    managed_present_cron_names: []

- name: Collect managed present cron names
  ansible.builtin.set_fact:
    managed_present_cron_names: "{{ managed_present_cron_names + [item.name] }}"
  loop: "{{ managed_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.state | default('present')) != 'absent'

- name: Remove unambiguous legacy cron jobs by name
  block:
    - name: Reconcile legacy cron names
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        ERR=/tmp/ansible-legacy-cron-error.txt
        RAW_ERR=$(mktemp)
        trap 'rm -f "$RAW_ERR"' EXIT
        set +e
        RAW=$(openclaw cron list --all --json 2>"$RAW_ERR")
        RC=$?
        set -e
        if [ "$RC" -ne 0 ]; then
            echo "ERROR: cron list failed during legacy cleanup for {{ item }} (exit $RC)" > "$ERR"
            exit 1
        fi
        CURRENT=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
        if ! jq -e '.jobs | type == "array"' >/dev/null 2>&1 <<< "$CURRENT"; then
            echo "ERROR: cron list returned invalid JSON during legacy cleanup for {{ item }}" > "$ERR"
            exit 1
        fi
        MATCHES=$(jq -r --arg n "{{ item }}" '[.jobs[] | select(.name == $n)] | length' <<< "$CURRENT")
        if [ "$MATCHES" -gt 1 ]; then
            echo "ERROR: legacy cron name {{ item }} matches $MATCHES jobs; refusing to guess" > "$ERR"
            exit 1
        elif [ "$MATCHES" -eq 1 ]; then
            if ! ID=$(jq -er --arg n "{{ item }}" '.jobs[] | select(.name == $n) | .id | select(type == "string" and length > 0)' <<< "$CURRENT"); then
                echo "ERROR: legacy cron job {{ item }} has no valid ID; refusing to remove it" > "$ERR"
                exit 1
            fi
            set +e
            openclaw cron remove "$ID" >/dev/null 2>"$RAW_ERR"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
                echo "ERROR: cron remove failed during legacy cleanup for {{ item }} (exit $RC)" > "$ERR"
                exit 1
            fi
            echo "UPDATED: removed legacy cron {{ item }}"
        else
            echo "OK"
        fi
      args:
        executable: /bin/bash
      environment:
        OPENCLAW_GATEWAY_TOKEN: "{{ _gw_token.stdout }}"
      loop: "{{ openclaw_legacy_cron_names | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: legacy_cron_cleanup
      changed_when: "'UPDATED' in (legacy_cron_cleanup.stdout | default(''))"
      no_log: true
  rescue:
    - name: Read redacted legacy cleanup error
      ansible.builtin.command: cat /tmp/ansible-legacy-cron-error.txt
      register: legacy_cron_error
      changed_when: false
      failed_when: false

    - name: Re-fail after legacy cleanup error
      ansible.builtin.fail:
        msg: >-
          {{ legacy_cron_error.stdout | default('Legacy cron cleanup failed without a captured error.', true) }}
  always:
    - name: Remove legacy cleanup error file
      ansible.builtin.file:
        path: /tmp/ansible-legacy-cron-error.txt
        state: absent
      changed_when: false

- name: Reconcile cron jobs with stable IDs
  block:
    - name: Mark cron reconciliation preparation phase
      ansible.builtin.set_fact:
        _cron_reconcile_phase: reconciler installation

    - name: Install cron reconciler
      ansible.builtin.copy:
        src: reconcile_openclaw_cron.py
        dest: /tmp/ansible-reconcile-openclaw-cron.py
        mode: "0700"
      changed_when: false
      check_mode: false

    - name: Mark cron manifest rendering phase
      ansible.builtin.set_fact:
        _cron_reconcile_phase: sensitive manifest rendering

    - name: Render cron reconciliation manifest
      ansible.builtin.template:
        src: cron-manifest.json.j2
        dest: /tmp/ansible-cron-manifest.json
        mode: "0600"
      changed_when: false
      check_mode: false
      no_log: true

    - name: Mark cron apply phase
      ansible.builtin.set_fact:
        _cron_reconcile_phase: scheduler apply and verification

    - name: Apply cron job state
      ansible.builtin.command:
        argv:
          - python3
          - /tmp/ansible-reconcile-openclaw-cron.py
          - --manifest
          - /tmp/ansible-cron-manifest.json
          - "{{ '--check' if ansible_check_mode else '--apply' }}"
          - --error-file
          - /tmp/ansible-cron-error.txt
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
        OPENCLAW_GATEWAY_TOKEN: "{{ _gw_token.stdout }}"
      register: cron_sync_result
      changed_when: >-
        cron_sync_result.rc == 2 or
        'UPDATED:' in (cron_sync_result.stdout | default(''))
      failed_when: cron_sync_result.rc not in [0, 2]
      check_mode: false
      no_log: true
  rescue:
    - name: Read redacted cron error
      ansible.builtin.command: cat /tmp/ansible-cron-error.txt
      register: cron_err_redacted
      changed_when: false
      failed_when: false

    - name: Show redacted cron error
      ansible.builtin.debug:
        msg: >-
          {{ cron_err_redacted.stdout_lines
             | default(['Cron reconciliation failed without a captured redacted error.'], true) }}

    - name: Re-fail after surfacing cron error
      ansible.builtin.fail:
        msg: >-
          Cron reconciliation failed during {{ _cron_reconcile_phase | default('preparation') }} (exit
          {{ cron_sync_result.rc | default('unknown', true) }}); see the redacted error above.
  always:
    - name: Remove cron reconciliation temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ansible-reconcile-openclaw-cron.py
        - /tmp/ansible-cron-manifest.json
        - /tmp/ansible-cron-error.txt
      changed_when: false
      check_mode: false

- name: Read final cron state including disabled jobs
  block:
    - name: Query final cron state
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        RAW_ERR=$(mktemp)
        trap 'rm -f "$RAW_ERR"' EXIT
        set +e
        RAW=$(openclaw cron list --all --json 2>"$RAW_ERR")
        RC=$?
        set -e
        if [ "$RC" -ne 0 ]; then
            echo "ERROR: final cron list failed (exit $RC)" > /tmp/ansible-final-cron-error.txt
            exit 1
        fi
        CLEAN=$(printf '%s\n' "$RAW" | sed -E '/^\[[A-Za-z][^]]*\]/d')
        if ! jq -e '.jobs | type == "array"' >/dev/null 2>&1 <<< "$CLEAN"; then
            echo "ERROR: final cron list returned invalid JSON" > /tmp/ansible-final-cron-error.txt
            exit 1
        fi
        printf '%s\n' "$CLEAN"
      args:
        executable: /bin/bash
      environment:
        OPENCLAW_GATEWAY_TOKEN: "{{ _gw_token.stdout }}"
      register: final_cron
      changed_when: false
      no_log: true
  rescue:
    - name: Read redacted final cron error
      ansible.builtin.command: cat /tmp/ansible-final-cron-error.txt
      register: final_cron_error
      changed_when: false
      failed_when: false

    - name: Re-fail after final cron query error
      ansible.builtin.fail:
        msg: >-
          {{ final_cron_error.stdout
             | default('Final cron verification failed without a captured error.', true) }}
  always:
    - name: Remove final cron error file
      ansible.builtin.file:
        path: /tmp/ansible-final-cron-error.txt
        state: absent
      changed_when: false
  when: not ansible_check_mode

- name: Assert cron policy converged
  ansible.builtin.assert:
    that:
      - _missing_managed_cron_names | length == 0
      - _enabled_paused_cron_jobs | length == 0
    fail_msg: >-
      Cron policy did not converge. Missing managed names:
      {{ _missing_managed_cron_names }}. Enabled jobs for paused agents:
      {{ _enabled_paused_cron_jobs | map(attribute='name') | list }}.
  vars:
    _final_cron_jobs: "{{ (final_cron.stdout | from_json).jobs }}"
    _missing_managed_cron_names: >-
      {{ managed_present_cron_names | difference(_final_cron_jobs | map(attribute='name') | list) }}
    _paused_agent_ids: >-
      {{ _openclaw_scheduled_automation_by_agent | dict2items
         | selectattr('value', 'equalto', false) | map(attribute='key') | list }}
    _enabled_paused_cron_jobs: >-
      {{ _final_cron_jobs | selectattr('agentId', 'in', _paused_agent_ids)
         | selectattr('enabled', 'equalto', true) | list }}
  when: not ansible_check_mode
