---
# Configure agent bindings — route Telegram DMs and groups to the correct agent.
# Uses the root-level `bindings` config path.

- name: Initialize bindings list
  ansible.builtin.set_fact:
    _telegram_bindings: []

# OpenClaw 2026.8.1+ calls a direct chat "direct"; deliver_type keeps "dm".
- name: Build binding entries
  ansible.builtin.set_fact:
    _telegram_bindings: "{{ _telegram_bindings + [{'agentId': item.id, 'match': {'channel': item.deliver_channel | default('telegram'), 'peer': {'kind': {'dm': 'direct'}.get(item.deliver_type, item.deliver_type), 'id': item.deliver_to | string}}}] }}"
  loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | list }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.deliver_to | default('') | length > 0

# With explicit agent ownership (2026.8.1+), a channel account without an owner
# binding stays blocked. The default agent owns every configured channel's
# default account; the peer bindings above are more specific and win.
- name: Give the default agent each configured channel account
  ansible.builtin.set_fact:
    _telegram_bindings: "{{ _telegram_bindings + [{'agentId': _default_agent_id, 'match': {'channel': item, 'accountId': 'default'}}] }}"
  vars:
    _default_agent_id: "{{ (openclaw_agents | selectattr('is_default', 'equalto', true) | first).id }}"
  loop: >-
    {{ ['telegram']
       + (['whatsapp'] if openclaw_agents | selectattr('deliver_channel', 'defined') | selectattr('deliver_channel', 'equalto', 'whatsapp') | list | length > 0 else [])
       + (['discord'] if discord_bot_token is defined and discord_bot_token | length > 0 else []) }}

- block:
    - name: Write bindings JSON to temp file
      ansible.builtin.copy:
        content: "{{ _telegram_bindings | to_json }}"
        dest: /tmp/ansible_bindings.json
        mode: '0600'
      changed_when: false

    - name: Set agent bindings
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        DESIRED=$(cat /tmp/ansible_bindings.json)
        CURRENT=$(openclaw config get bindings 2>&1 | sed -E '/^\[[A-Za-z][^]]*\]/d') || {
            if echo "$CURRENT" | grep -qE '^Config path is valid but unset:'; then
                CURRENT="[]"
            else
                echo "ERROR reading bindings: $CURRENT" >&2
                exit 1
            fi
        }
        C_NORM=$(echo "$CURRENT" | jq -cS '.' 2>/dev/null || echo "PARSE_FAIL")
        D_NORM=$(echo "$DESIRED" | jq -cS '.')
        if [ "$C_NORM" != "PARSE_FAIL" ] && [ "$C_NORM" = "$D_NORM" ]; then
            echo "OK"
        else
            openclaw config set bindings --json "$DESIRED"
            echo "UPDATED"
        fi
      args:
        executable: /bin/bash
      register: bindings_result
      changed_when: "'UPDATED' in bindings_result.stdout"
      notify: restart openclaw-gateway
  always:
    - name: Clean up bindings temp file
      ansible.builtin.file:
        path: /tmp/ansible_bindings.json
        state: absent
      changed_when: false
  when: _telegram_bindings | length > 0

- name: Clear agent bindings
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    output=$(openclaw config unset bindings 2>&1) || {
        echo "$output" | grep -qi "not set\|not found\|does not exist" || { echo "ERROR: $output" >&2; exit 1; }
    }
    echo "OK"
  args:
    executable: /bin/bash
  changed_when: false
  when: _telegram_bindings | length == 0

- name: Verify bindings
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    openclaw agents list --json --bindings 2>/dev/null | sed -E '/^\[[A-Za-z][^]]*\]/d'
  args:
    executable: /bin/bash
  register: agents_with_bindings
  changed_when: false
  check_mode: false

- name: Show agent bindings
  ansible.builtin.debug:
    var: agents_with_bindings.stdout | from_json
  when: agents_with_bindings.stdout | default('') | length > 0
