---
# gateway.tailscale.mode serve: since 2026.8 the gateway runs `tailscale serve --bg=false`
# for as long as it lives, falling back to `sudo -n` without operator rights. A root child
# outlives a stop that systemd's user manager cannot kill, keeps port 443, and the next start
# exits 78 for good (reproduced on the test server). As operator, ubuntu runs it inside the
# service, as OpenClaw's own error message recommends. Set before anything here starts it.
- name: Let the gateway run Tailscale Serve without sudo
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "$(tailscale debug prefs | jq -r '.OperatorUser // ""')" != ubuntu ]; then
        tailscale set --operator=ubuntu
        echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: tailscale_operator
  changed_when: "'CHANGED' in tailscale_operator.stdout"

- name: Check if openclaw-gateway service file exists
  ansible.builtin.stat:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service
  register: daemon_service

# Before any regeneration below starts the gateway on a new OpenClaw.
- name: Give the existing gateway unit its container launcher
  ansible.builtin.include_tasks: claude-cli-path.yml
  when: daemon_service.stat.exists

- name: Install OpenClaw daemon
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    openclaw daemon install
  args:
    executable: /bin/bash
  when: not daemon_service.stat.exists

# Regenerate the service file when this run installed OpenClaw, or when the file
# still comes from a pre-2026.9 installer (only those wrote OPENCLAW_SERVICE_VERSION):
# that catches a run that failed between the install and here. 2026.9 files carry no
# version, and an old file stops the gateway after 30 s instead of its 315 s drain.
- name: Regenerate daemon service file after an OpenClaw install
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    SERVICE_FILE=/home/ubuntu/.config/systemd/user/openclaw-gateway.service
    if {{ (openclaw_package_install is changed) | ternary('true', 'false') }} || grep -q 'OPENCLAW_SERVICE_VERSION=' "$SERVICE_FILE"; then
        openclaw daemon install --force
        systemctl --user daemon-reload
        echo REGENERATED
    fi
  args:
    executable: /bin/bash
  register: daemon_regenerated
  changed_when: "'REGENERATED' in daemon_regenerated.stdout"
  notify: restart openclaw-gateway
  when: daemon_service.stat.exists

# The WS handshake timeout drop-in is no longer needed — 10s is the upstream
# default since 2026.3.22 (PR #49262). Clean up the orphan file.
- name: Remove legacy handshake timeout drop-in (10s is now the upstream default)
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/handshake-timeout.conf
    state: absent
  notify:
    - reload user systemd
    - restart openclaw-gateway
