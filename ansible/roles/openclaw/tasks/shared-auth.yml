---
- name: Validate the shared authentication layout
  ansible.builtin.assert:
    that: [claude_secure_storage_dir == '/home/ubuntu/.claude/shared/auth']
    fail_msg: Shared auth must use the dedicated shared/auth layout; never bind the whole Claude config directory into C.

- name: Validate the idempotent credential reset request
  ansible.builtin.assert:
    that:
      - (claude_oauth_rotate_credentials | default(false)) is boolean or ((claude_oauth_rotate_credentials | default(false)) is string and (claude_oauth_rotate_credentials is match('^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$')))
    fail_msg: Claude OAuth reset must be false, true, or a stable request ID. Reuse the same ID on retries; choose a new ID for another reset.
    quiet: true

- name: Create private authentication and host-only environment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /home/ubuntu/.claude/shared
    - "{{ claude_secure_storage_dir }}"
    - /home/ubuntu/.local/bin
    - /home/ubuntu/.config/openclaw

- name: Install SDK-compatible credential provisioning and checksum helpers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/ubuntu/.local/bin/{{ item.dest }}"
    mode: "0700"
  loop:
    - {src: claude-oauth-seed.cjs, dest: claude-oauth-seed}
    - {src: claude-oauth-seed.py, dest: claude-oauth-seed.py}

- name: Persist provisioning code before installing a startup dependency
  ansible.builtin.command:
    argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, persist-assets, /home/ubuntu/.local/bin/claude-oauth-seed, /home/ubuntu/.local/bin/claude-oauth-seed.py]
  changed_when: false

- name: Inspect the gateway unit before a possible migration
  ansible.builtin.stat:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service
  register: claude_gateway_unit

- name: Initialize authentication cutover state
  ansible.builtin.set_fact:
    _claude_auth_failed: false
    _claude_auth_partial_replacement: false
    _claude_auth_credentials_changed: false
    _claude_auth_environment_changed: false

# Prepare fallible public config BEFORE stopping anything. One host-only file
# supplies both shell and gateway; C cannot inject host environment through it.
- name: Validate pointer preparation before changing gateway startup assets
  ansible.builtin.command:
    argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, validate-storage, /home/ubuntu/.claude, "{{ claude_secure_storage_dir }}"]
  changed_when: false

- name: Create the gateway drop-in directory
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d
    state: directory
    mode: "0755"

- name: Install persistent start-time login recovery independent of transient timers
  ansible.builtin.template:
    src: claude-auth-startup.service.j2
    dest: /home/ubuntu/.config/systemd/user/openclaw-claude-auth.service
    mode: "0600"
  register: claude_auth_startup

- name: Persist login recovery before requiring it at gateway startup
  ansible.builtin.command:
    argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, persist-assets, /home/ubuntu/.config/systemd/user/openclaw-claude-auth.service]
  changed_when: false

- name: Point the gateway at the host-only authentication environment
  ansible.builtin.copy:
    dest: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/claude-auth.conf
    content: "[Unit]\nRequires=openclaw-claude-auth.service\nAfter=openclaw-claude-auth.service\n\n[Service]\nEnvironmentFile=/home/ubuntu/.config/openclaw/claude-auth.env\n"
    mode: "0600"
  register: claude_auth_dropin

- name: Point interactive and SSH shells at the same environment file
  ansible.builtin.blockinfile:
    path: "/home/ubuntu/{{ item }}"
    marker: "# {mark} ANSIBLE CLAUDE SECURE STORAGE"
    insertbefore: BOF
    create: true
    mode: "0644"
    block: |
      . /home/ubuntu/.config/openclaw/claude-auth.env
      export CLAUDE_SECURESTORAGE_CONFIG_DIR
  loop: [.bashrc, .profile]

- name: Persist startup references before any login mutation
  ansible.builtin.command:
    argv:
      - node
      - /home/ubuntu/.local/bin/claude-oauth-seed
      - persist-assets
      - /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/claude-auth.conf
      - /home/ubuntu/.bashrc
      - /home/ubuntu/.profile
  changed_when: false

- name: Reload systemd after durable authentication drop-in changes
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  when: (claude_auth_dropin.changed or claude_auth_startup.changed) and claude_gateway_unit.stat.exists

- name: Allocate an independent cutover recovery unit name
  ansible.builtin.set_fact:
    _claude_auth_recovery_unit: >-
      {{ 'openclaw-claude-auth-' + lookup('pipe', 'python3 -c "import uuid; print(uuid.uuid4().hex)"') }}

- name: Arm host-owned recovery before any login mutation
  ansible.builtin.command:
    argv: [systemd-run, --user, "--unit={{ _claude_auth_recovery_unit }}", --on-active=3m, --timer-property=OnUnitInactiveSec=3m, --property=Restart=on-failure, --property=RestartSec=3m, --property=StartLimitIntervalSec=0, --timer-property=AccuracySec=1s, --timer-property=RandomizedDelaySec=0, /usr/bin/node, /home/ubuntu/.local/bin/claude-oauth-seed, recover, /home/ubuntu/.claude, "{{ claude_secure_storage_dir }}"]
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  register: claude_auth_recovery_armed
  changed_when: false

- name: Apply shared authentication and recover independently on failure
  block:
    - name: Move or resume the current login under both SDK locking domains
      ansible.builtin.command:
        argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, migrate, /home/ubuntu/.claude, "{{ claude_secure_storage_dir }}", --quiesce-gateway]
      register: claude_auth_migration
      changed_when: claude_auth_migration.stdout in ['MIGRATED', 'MIGRATION_RESUMED']

    - name: Select and journal the current login location under SDK locks
      ansible.builtin.command:
        argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, prepare-storage, /home/ubuntu/.claude, "{{ claude_secure_storage_dir }}"]
      register: claude_auth_environment
      changed_when: claude_auth_environment.stdout == 'ENV_CHANGED'

    - name: Record environment and startup changes for completion
      ansible.builtin.set_fact:
        _claude_auth_environment_changed: true
      when: claude_auth_dropin.changed or claude_auth_environment.changed or claude_auth_startup.changed
      changed_when: true

    - name: Seed or rotate the configured authentication source
      block:
        - name: Allocate a private seed for this provisioning run
          ansible.builtin.tempfile:
            state: file
            prefix: ansible-claude-seed-
            suffix: .json
          register: claude_seed_file
          changed_when: false
          no_log: true

        - name: Write the private configured credential seed
          ansible.builtin.copy:
            content: "{{ claude_oauth_credentials if claude_oauth_credentials | default('') | length > 0 else (_claude_setup_credentials | to_nice_json) }}\n"
            dest: "{{ claude_seed_file.path }}"
            mode: "0600"
          vars:
            _claude_setup_credentials:
              claudeAiOauth:
                accessToken: "{{ claude_setup_token | default('') }}"
                refreshToken: ""
                expiresAt: 1813499823032
                scopes: [user:file_upload, user:inference, user:mcp_servers, user:profile, user:sessions:claude_code]
                subscriptionType: max
          changed_when: false
          no_log: true

        - name: Preserve refreshes while applying configured seed changes
          ansible.builtin.command:
            argv: "{{ ['node', '/home/ubuntu/.local/bin/claude-oauth-seed', claude_seed_file.path, claude_secure_storage_dir + '/.credentials.json', claude_secure_storage_dir + '/.credentials-seed.sha256'] + (['--rotate'] if (claude_oauth_rotate_credentials | default(false) | string | lower) in ['true', 'yes', 'on', '1'] else (['--rotate=' + claude_oauth_rotate_credentials] if (claude_oauth_rotate_credentials | default(false) | string | lower) not in ['false', 'no', 'off', '0'] else [])) }}"
          register: claude_oauth_seed_result
          changed_when: claude_oauth_seed_result.stdout != 'PRESERVED'

        - name: Record replaced credentials or recovered restart intent
          ansible.builtin.set_fact:
            _claude_auth_credentials_changed: true
          when: claude_oauth_seed_result.stdout in ['SEEDED', 'ROTATED', 'RECOVERED']
          changed_when: true
      rescue:
        - name: Record required refresh after partial credential replacement
          ansible.builtin.set_fact:
            _claude_auth_partial_replacement: true
          when: claude_oauth_seed_result is defined and claude_oauth_seed_result.stdout | default('') == 'ROTATED_VERSION_PENDING'
          changed_when: true

        - name: Report credential seeding failure
          ansible.builtin.fail:
            msg: Claude seeding failed. Partial replacement requests restart before retry. Check private JSON, permissions and SDK refresh locks; diagnostics withheld.
      always:
        - name: Remove only this provisioning run's private seed
          ansible.builtin.file:
            path: "{{ claude_seed_file.path }}"
            state: absent
          when: claude_seed_file is defined and claude_seed_file.path is defined
          changed_when: false
          no_log: true

    - name: Verify local auth reads the shared login
      ansible.builtin.command: claude auth status
      environment:
        PATH: "/usr/local/bin:/home/ubuntu/.npm-global/bin:{{ ansible_facts['env']['PATH'] }}"
        CLAUDE_SECURESTORAGE_CONFIG_DIR: "{{ claude_secure_storage_dir }}"
      changed_when: false
      register: claude_auth_check
      failed_when: claude_auth_check.rc != 0 or not (claude_auth_check.stdout | from_json).loggedIn
      no_log: true
  rescue:
    - name: Keep the cutover failure explicit while restoring service access
      ansible.builtin.set_fact:
        _claude_auth_failed: true
  always:
    - name: Recheck gateway installation after concurrent provisioning
      ansible.builtin.stat:
        path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service
      register: claude_gateway_unit

    - name: Recover the unique preserved login and start independently of prior failures
      ansible.builtin.command:
        argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, recover, /home/ubuntu/.claude, "{{ claude_secure_storage_dir }}"]
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      when: claude_gateway_unit.stat.exists
      register: claude_auth_recovered
      changed_when: claude_auth_recovered.stdout in ['GATEWAY_REFRESHED', 'GATEWAY_STARTED']

    - name: Record completed credential recovery and remaining settings refresh
      ansible.builtin.set_fact:
        _claude_auth_credentials_changed: false
        _claude_auth_environment_changed: "{{ _claude_auth_environment_changed and claude_auth_recovered.stdout == 'GATEWAY_RECOVERED' }}"
        _claude_auth_partial_replacement: false
      when: claude_gateway_unit.stat.exists and claude_auth_recovered.rc | default(1) == 0

    - name: Request changed credentials or environment refresh after late unit installation
      ansible.builtin.set_fact:
        _claude_auth_credentials_changed: true
      changed_when: true
      when: claude_gateway_unit.stat.exists and (_claude_auth_credentials_changed or _claude_auth_environment_changed or _claude_auth_partial_replacement)
      notify: restart openclaw-gateway

    - name: Select the surviving login even when bootstrap failed
      ansible.builtin.command:
        argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, select-storage, /home/ubuntu/.claude, "{{ claude_secure_storage_dir }}"]
      register: claude_bootstrap_storage
      changed_when: claude_bootstrap_storage.stdout == 'ENV_CHANGED'
      when: not claude_gateway_unit.stat.exists

    - name: Read durable restart intent even if the seeding process died
      ansible.builtin.command:
        argv: [node, /home/ubuntu/.local/bin/claude-oauth-seed, restart-request, "{{ claude_secure_storage_dir }}"]
      register: claude_auth_pending_restart
      changed_when: false
      when: claude_gateway_unit.stat.exists

    - name: Request restart for unacknowledged credential replacement
      ansible.builtin.set_fact:
        _claude_auth_credentials_changed: true
      when: claude_gateway_unit.stat.exists and claude_auth_pending_restart.stdout | default('NONE') != 'NONE'
      changed_when: true
      notify: restart openclaw-gateway

    - name: Complete required credential or environment restart before disarming recovery
      ansible.builtin.meta: flush_handlers
      when: claude_gateway_unit.stat.exists and (_claude_auth_partial_replacement or _claude_auth_credentials_changed or _claude_auth_environment_changed)

    - name: Cancel only this provisioning run's timer after gateway recovery or refresh
      ansible.builtin.systemd:
        name: "{{ _claude_auth_recovery_unit }}.timer"
        scope: user
        state: stopped
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      changed_when: false
      when: >-
        (claude_gateway_unit.stat.exists and claude_auth_recovered.rc | default(1) == 0)
        or (not claude_gateway_unit.stat.exists and claude_bootstrap_storage.rc | default(1) == 0)

    - name: Drain this run's already-triggered recovery callback before completion
      ansible.builtin.command:
        argv: [systemctl, --user, show, "{{ _claude_auth_recovery_unit }}.service", --property=ActiveState, --value]
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      register: claude_auth_recovery_drained
      changed_when: false
      until: claude_auth_recovery_drained.stdout | trim == 'inactive'
      retries: 450
      delay: 2

    - name: Fail visibly after recovery attempts
      ansible.builtin.fail:
        msg: Shared authentication provisioning failed; independent cutover recovery was armed where applicable. Repair private credentials, storage permissions or old active Claude processes and retry. No rollout was performed.
      when: _claude_auth_failed
