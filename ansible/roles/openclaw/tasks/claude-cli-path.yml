---
# OpenClaw 2026.9.8 starts `claude` from the gateway's PATH (agents.defaults.cliBackends
# is gone). With containers enabled, a gateway-only PATH entry puts a `claude` that is
# the container launcher first; shells keep the real Claude Code for `claude auth login`.
# The only writer of that entry. The prefix is our one fact; the rest is the unit's own PATH,
# read from the unit file because the running service's PATH already includes this drop-in.
# Included twice: before the service is regenerated, so the first start of a new OpenClaw
# already has it (a gateway started without it runs the real Claude Code on the host), and
# after the unit exists or changed, so the PATH matches the regenerated unit exactly.
- name: Give the gateway a claude that is the container launcher
  when: openclaw_claude_cli_enabled | bool
  block:
    - name: Read the gateway unit's own PATH
      ansible.builtin.slurp:
        src: /home/ubuntu/.config/systemd/user/openclaw-gateway.service
      register: _gateway_unit

    - name: Find the gateway unit's PATH
      ansible.builtin.set_fact:
        _gateway_unit_path: "{{ _gateway_unit.content | b64decode | regex_search('(?m)^Environment=PATH=(\\S+)$', '\\1') }}"

    - name: Require the gateway unit to set its PATH
      ansible.builtin.assert:
        that: _gateway_unit_path is not none
        fail_msg: The gateway unit has no Environment=PATH line; the claude-cli PATH entry cannot be derived.

    - name: Ensure the gateway's drop-in directory exists
      ansible.builtin.file:
        path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d
        state: directory
        mode: "0755"

    - name: Create the root-owned directory for the gateway's claude
      become: true
      ansible.builtin.file:
        path: /usr/local/lib/openclaw/claude-cli-bin
        state: directory
        mode: "0755"

    # A script, not a symlink: until the claude-cli role installs the launcher a link would
    # dangle, and a PATH lookup skips it and finds the real Claude Code next. The script
    # always resolves and fails while the launcher is missing.
    - name: Make the gateway's claude the container launcher
      become: true
      ansible.builtin.copy:
        dest: /usr/local/lib/openclaw/claude-cli-bin/claude
        content: "#!/bin/sh\nexec {{ openclaw_claude_cli_command }} \"$@\"\n"
        mode: "0755"
        owner: root
        group: root
        follow: false
      notify: restart openclaw-gateway

    - name: Put the gateway's claude first on its PATH
      ansible.builtin.copy:
        dest: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/claude-cli-path.conf
        content: "[Service]\nEnvironment=PATH=/usr/local/lib/openclaw/claude-cli-bin:{{ _gateway_unit_path[0] }}\n"
        mode: "0644"
      register: _claude_cli_path_written
      notify: restart openclaw-gateway

- name: Remove the gateway's claude when containers are off
  when: not openclaw_claude_cli_enabled | bool
  block:
    - name: Remove the gateway's claude PATH entry
      ansible.builtin.file:
        path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/claude-cli-path.conf
        state: absent
      register: _claude_cli_path_removed
      notify: restart openclaw-gateway

    - name: Remove the gateway's claude
      become: true
      ansible.builtin.file:
        path: /usr/local/lib/openclaw/claude-cli-bin
        state: absent
      notify: restart openclaw-gateway

- name: Reload systemd after the gateway PATH entry changed
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  # A skipped task registers changed=false, so each branch keeps its own result.
  when: _claude_cli_path_written.changed or _claude_cli_path_removed.changed
